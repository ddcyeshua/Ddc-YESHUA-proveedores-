));gap:18px}.card{background:#fff;border:1px solid var(--line);border-radius:17px;padding:15px}.product-photo{width:100%;height:220px;object-fit:contain;background:#f8fafc;border-radius:12px;margin-bottom:10px}.pricebox{background:#f6f8fc;border-radius:12px;padding:11px;margin:10px 0}.row{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}.badge{display:inline-block;padding:5px 9px;border-radius:99px;background:#eef2ff;color:#3146a3;font-size:12px;font-weight:700}.tabs{display:flex;gap:8px;overflow:auto;margin:12px 0}.tabs button{white-space:nowrap}.tabactive{background:var(--blue);color:#fff}.empty{text-align:center;padding:35px;color:var(--muted)}.statgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.stat{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px}.stat b{font-size:27px;display:block}.modal{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;padding:18px;z-index:20}.modalbox{background:#fff;border-radius:18px;max-width:850px;width:100%;max-height:92vh;overflow:auto;padding:20px}.login{min-height:100vh;display:grid;place-items:center;padding:20px}.loginbox{width:min(430px,100%);background:#fff;border-radius:20px;padding:25px;box-shadow:0 10px 40px #10182818}.notice{padding:12px;border-radius:12px;background:#eef4ff;color:#294a9a;margin:10px 0}.success{background:#eaf8ef;color:#126b38}.warning{background:#fff7df;color:#815900}.dangerbox{background:#fff0f2;color:#a51d2d}.sectiontitle{margin:0 0 10px}.list{display:grid;gap:10px}.orderline{border:1px solid var(--line);border-radius:12px;padding:12px;background:#fff}.stock-green{color:#0b7b3e}.stock-yellow{color:#8a6100}.stock-red{color:#b42332}.right{margin-left:auto}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:700px}.table th,.table td{border-bottom:1px solid var(--line);padding:9px;text-align:left;vertical-align:top}.login .logo{display:block;margin:auto;width:95px;height:95px}
@media(max-width:760px){.topin{align-items:flex-start}.userbox{display:none}.grid2,.cards{grid-template-columns:1fr}.grid3,.statgrid{grid-template-columns:repeat(2,minmax(0,1fr))}.brand h1{font-size:21px}.logo{width:60px;height:60px}.product-photo{height:210px}.wrap{padding:12px}}

.product-list{display:flex;flex-direction:column;gap:8px;margin-top:14px}.product-row{width:100%;display:grid;grid-template-columns:1fr 2fr 1.4fr;gap:14px;align-items:center;text-align:left;padding:15px 16px;border:1px solid #e2e5ea;border-radius:14px;background:#fff;color:inherit;cursor:pointer;font:inherit}.product-row:hover{border-color:#2d6cdf;box-shadow:0 2px 10px rgba(0,0,0,.06)}.product-row span:first-child{font-weight:700;color:#667085}.product-row strong{font-size:16px}.product-row span:last-child{color:#2d6cdf;font-weight:600}.detail-photo{display:block;width:100%;max-height:300px;object-fit:contain;border-radius:14px;background:#f5f6f8;margin-bottom:14px}.detail-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:14px 0}.detail-grid>div{padding:12px;border:1px solid #e5e7eb;border-radius:12px;background:#fafafa}.detail-grid b{font-size:12px;color:#667085}@media(max-width:700px){.product-row{grid-template-columns:1fr 1.5fr;gap:6px 12px}.product-row span:last-child{grid-column:1/-1}.detail-grid{grid-template-columns:1fr}}
</style>

<body>
<div id="app"><div class="login"><div class="loginbox"><div style="text-align:center;font-size:46px">🟨</div><h1>DDC Yeshua</h1><p class="muted">Sistema interno en la nube</p><div id="loginmsg"></div><div class="field"><label>Correo</label><input id="lemail" type="email" autocomplete="username"></div><div class="field"><label>Contraseña</label><input id="lpass" type="password" autocomplete="current-password"></div><button class="primary" style="width:100%" onclick="doLogin()">Ingresar</button></div></div></div>
<div id="modal" class="modal hidden"><div class="modalbox" id="modalbox"></div></div>
<script>
const SUPABASE_URL='https://uzdgkjsizjohgvpzbqew.supabase.co';
const SUPABASE_KEY='sb_publishable_lhfVzu3gzCBb5JdmFLOG7w_7Yh09G1p';
const STATE_ID='ddc-yeshua';
const DEFAULT={suppliers:[],products:[],orders:[],stock:[]};
let state=JSON.parse(JSON.stringify(DEFAULT)),session=null,activeTab='buscar',searchText='',pendingOrderLines=[];
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
const money=n=>Number(n||0).toLocaleString('es-AR',{minimumFractionDigits:2,maximumFractionDigits:2});
const uid=()=>crypto.randomUUID?crypto.randomUUID():'id-'+Date.now()+'-'+Math.random().toString(16).slice(2);
function openModal(html){document.getElementById('modalbox').innerHTML=html;document.getElementById('modal').classList.remove('hidden')}
function closeModal(){let m=document.getElementById('modal');let u=m&&m.dataset.pdfObjectUrl;if(u){URL.revokeObjectURL(u);delete m.dataset.pdfObjectUrl}m.classList.add('hidden')}
document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
function authHeaders(token){return {'apikey':SUPABASE_KEY,'Authorization':'Bearer '+token,'Content-Type':'application/json'}}
async function api(path,opts={}){let token=opts.token||localStorage.getItem('ddc_access_token');let headers=Object.assign({'apikey':SUPABASE_KEY},opts.headers||{});if(token)headers.Authorization='Bearer '+token;return fetch(SUPABASE_URL+path,Object.assign({},opts,{headers}))}
async function doLogin(){const m=document.getElementById('loginmsg');m.innerHTML='<div class="notice">Ingresando…</div>';try{let r=await fetch(SUPABASE_URL+'/auth/v1/token?grant_type=password',{method:'POST',headers:{'apikey':SUPABASE_KEY,'Content-Type':'application/json'},body:JSON.stringify({email:document.getElementById('lemail').value.trim(),password:document.getElementById('lpass').value})});let j=await r.json();if(!r.ok){m.innerHTML='<div class="notice dangerbox">'+esc(j.error_description||j.msg||j.message||'No se pudo iniciar sesión.')+'</div>';return}localStorage.setItem('ddc_access_token',j.access_token);if(j.refresh_token)localStorage.setItem('ddc_refresh_token',j.refresh_token);session={user:j.user,access_token:j.access_token};await startApp() }catch(e){m.innerHTML='<div class="notice dangerbox">No se pudo conectar con la nube. Revisa tu conexión.</div>'}}
async function logout(){localStorage.removeItem('ddc_access_token');localStorage.removeItem('ddc_refresh_token');session=null;state=JSON.parse(JSON.stringify(DEFAULT));render()}
async function restoreSession(){let token=localStorage.getItem('ddc_access_token');if(!token){session=null;render();return}try{let r=await api('/auth/v1/user',{token});if(!r.ok){localStorage.removeItem('ddc_access_token');session=null;render();return}let u=await r.json();session={user:u,access_token:token};await startApp()}catch(e){session=null;render()}}
async function loadState(){let r=await api('/rest/v1/app_state?id=eq.'+encodeURIComponent(STATE_ID)+'&select=data');if(!r.ok)throw new Error(await r.text());let rows=await r.json();if(rows[0]?.data)state=Object.assign(JSON.parse(JSON.stringify(DEFAULT)),rows[0].data)}
async function saveState(){if(!session)throw new Error('Sesión no iniciada');let r=await api('/rest/v1/app_state',{method:'POST',headers:Object.assign(authHeaders(session.access_token),{'Prefer':'resolution=merge-duplicates,return=minimal'}),body:JSON.stringify({id:STATE_ID,data:state,updated_at:new Date().toISOString(),updated_by:session.user.id})});if(!r.ok)throw new Error(await r.text())}
async function startApp(){if(!session){render();return}try{await loadState();render()}catch(e){document.getElementById('app').innerHTML='<div class="login"><div class="loginbox"><h2>DDC Yeshua</h2><div class="notice dangerbox">No se pudo cargar la información de la nube.<br><small>'+esc(e.message)+'</small></div><button class="secondary" onclick="logout()">Volver al inicio</button></div></div>'}}
async function loadScript(url,globalName){if(globalName&&window[globalName])return window[globalName];return new Promise((resolve,reject)=>{let s=document.createElement('script');s.src=url;s.onload=()=>resolve(globalName?window[globalName]:true);s.onerror=()=>reject(new Error('No se pudo cargar '+url));document.head.appendChild(s)})}
function loginView(){return '<div class="login"><div class="loginbox"><div style="text-align:center;font-size:46px">🟨</div><h1>DDC Yeshua</h1><p class="muted">Sistema interno en la nube</p><div id="loginmsg"></div><div class="field"><label>Correo</label><input id="lemail" type="email" autocomplete="username"></div><div class="field"><label>Contraseña</label><input id="lpass" type="password" autocomplete="current-password"></div><button class="primary" style="width:100%" onclick="doLogin()">Ingresar</button></div></div>'}
function usersView(){
 return '<div class="row"><div><h2>👥 Usuarios</h2><div class="muted">Administrá el acceso al sistema DDC Yeshua.</div></div></div>' +
 '<div class="panel"><h3>Usuario actual</h3><p style="font-size:18px;margin:8px 0 18px"><b>'+esc(session.user.email)+'</b></p>' +
 '<div class="actions"><button class="primary" onclick="logout()">🔄 Cambiar usuario</button>' +
 '<a class="secondary" href="https://supabase.com/dashboard/project/uzdgkjsizjohgvpzbqew/auth/users" target="_blank" rel="noopener" style="text-decoration:none;display:inline-flex;align-items:center">➕ Agregar / administrar usuarios</a></div>' +
 '<div class="notice" style="margin-top:16px">Para crear o eliminar usuarios de forma segura, usá el administrador de usuarios de Supabase. El botón <b>Cambiar usuario</b> cierra la sesión actual para que otra persona pueda ingresar con su propia cuenta.</div></div>';
}
function render(){if(!session){document.getElementById('app').innerHTML=loginView();return}let content=activeTab==='buscar'?searchView():activeTab==='productos'?productsView():activeTab==='proveedores'?supplierView():activeTab==='pedidos'?ordersView():activeTab==='usuarios'?usersView():stockView();document.getElementById('app').innerHTML='<header class="top"><div class="topin"><div class="brand"><div style="width:72px;height:72px;border-radius:15px;background:#fff;display:grid;place-items:center;font-weight:900;color:#c33;font-size:23px">DDC</div><div><h1>DDC — Proveedores</h1><p>Sistema interno de comparación de productos · ☁️ Nube</p></div></div><div class="userbox">'+esc(session.user.email)+'<br><button class="secondary small" onclick="logout()">Salir</button></div></div></header><main class="wrap"><div class="tabs"><button class="'+(activeTab==='buscar'?'tabactive':'')+'" onclick="activeTab=\'buscar\';render()">🔎 Buscar</button><button class="'+(activeTab==='productos'?'tabactive':'')+'" onclick="activeTab=\'productos\';render()">📦 Productos</button><button class="'+(activeTab==='proveedores'?'tabactive':'')+'" onclick="activeTab=\'proveedores\';render()">🏢 Proveedores</button><button class="'+(activeTab==='pedidos'?'tabactive':'')+'" onclick="activeTab=\'pedidos\';render()">🧾 Pedidos</button><button class="'+(activeTab==='stock'?'tabactive':'')+'" onclick="activeTab=\'stock\';render()">📦 Stock</button><button class="'+(activeTab==='usuarios'?'tabactive':'')+'" onclick="activeTab=\'usuarios\';render()">👥 Usuarios</button></div>'+content+'</main>'}
function productsView(){
let q=(window.productFilter||'').toLowerCase().trim();
let supplier=(window.productSupplierFilter||'');
let category=(window.productCategoryFilter||'');
let xs=state.products.filter(p=>{
  let text=[p.model,p.name,p.brand,p.category,p.supplierName,p.notes].map(v=>String(v||'').toLowerCase()).join(' ');
  return (!q||text.includes(q))&&(!supplier||p.supplierId===supplier)&&(!category||p.category===category);
});
let suppliers='<option value="">Todos los proveedores</option>'+state.suppliers.map(s=>'<option value="'+s.id+'" '+(supplier===s.id?'selected':'')+'>'+esc(s.name)+'</option>').join('');
let cats=['Vidrios','Fundas','Accesorios','Varios','Tablets','Notebooks'];
return '<div class="row"><div><h2>📦 Productos</h2><div class="muted">Productos cargados y guardados en la nube.</div></div><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="primary" onclick="productForm()">+ Agregar producto</button><button class="secondary" onclick="bulkProductForm()">+ Cargar varios</button></div></div>'+
'<div class="panel"><div class="toolbar"><input class="search" value="'+esc(window.productFilter||'')+'" oninput="window.productFilter=this.value;render()" placeholder="🔎 Buscar modelo, producto, marca o proveedor…"></div><div class="grid2"><div class="field"><label>Proveedor</label><select onchange="window.productSupplierFilter=this.value;render()">'+suppliers+'</select></div><div class="field"><label>Clasificación</label><select onchange="window.productCategoryFilter=this.value;render()"><option value="">Todas</option>'+cats.map(c=>'<option value="'+c+'" '+(category===c?'selected':'')+'>'+c+'</option>').join('')+'</select></div></div><div class="notice">'+xs.length+' producto'+(xs.length===1?'':'s')+' cargado'+(xs.length===1?'':'s')+'. Tocá un producto para ver toda su información.</div></div>'+
'<div class="product-list">'+(xs.length?xs.map(productRow).join(''):'<div class="panel empty">No hay productos que coincidan con la búsqueda.</div>')+'</div>';
}
function bulkProductForm(){
let rows=Array.from({length:8},(_,i)=>bulkProductRow(i)).join('');
let html='<h2>📦 Cargar varios productos</h2><div class="muted" style="margin-bottom:12px">Podés cargar muchos productos de una vez. Los que dejes vacíos no se guardan.</div><div class="field"><label>Proveedor para todos</label><select id="bulkSupplier">'+state.suppliers.map(s=>'<option value="'+s.id+'">'+esc(s.name)+'</option>').join('')+'</select></div><div style="overflow:auto"><table style="min-width:1100px"><thead><tr><th>Modelo / Producto</th><th>Clasificación</th><th>Marca</th><th>Calidad</th><th>USD</th><th>Tasa</th><th>ARS</th><th>Despacho</th></tr></thead><tbody id="bulkRows">'+rows+'</tbody></table></div><div class="actions"><button class="secondary" onclick="addBulkProductRow()">＋ Agregar 5 filas</button><button class="secondary" onclick="closeModal()">Cancelar</button><button class="primary" onclick="saveBulkProducts()">💾 Guardar todos</button></div>';openModal(html);}
function bulkProductRow(i){return '<tr><td><input class="bulk-model" placeholder="Modelo / producto"></td><td><select class="bulk-cat"><option>Vidrios</option><option>Fundas</option><option>Accesorios</option><option>Varios</option><option>Tablets</option><option>Notebooks</option></select></td><td><input class="bulk-brand" placeholder="Marca"></td><td><select class="bulk-quality"><option>Alta</option><option selected>Media</option><option>Baja</option></select></td><td><input class="bulk-usd" type="number" step="0.01" placeholder="USD"></td><td><input class="bulk-rate" type="number" step="0.01" placeholder="Tasa"></td><td><input class="bulk-ars" type="number" step="0.01" placeholder="ARS"></td><td><input class="bulk-dispatch" placeholder="Ej. 24-48 h"></td></tr>'}
function addBulkProductRow(){let b=document.getElementById('bulkRows');for(let i=0;i<5;i++)b.insertAdjacentHTML('beforeend',bulkProductRow(b.children.length));}
async function saveBulkProducts(){let supplierId=document.getElementById('bulkSupplier').value,s=state.suppliers.find(x=>x.id===supplierId);if(!s)return alert('Primero crea un proveedor.');let rows=[...document.querySelectorAll('#bulkRows tr')],added=0;rows.forEach(r=>{let model=r.querySelector('.bulk-model').value.trim();if(!model)return;let usd=r.querySelector('.bulk-usd').value,rate=Number(r.querySelector('.bulk-rate').value||s.rate||0),ars=r.querySelector('.bulk-ars').value;state.products.push({id:uid(),supplierId,supplierName:s.name,model,name:model,brand:r.querySelector('.bulk-brand').value.trim(),category:r.querySelector('.bulk-cat').value,quality:r.querySelector('.bulk-quality').value,dispatch:r.querySelector('.bulk-dispatch').value.trim(),priceMode:ars&&!usd?'ars':'usd',usd,rate,arsPrice:ars||'',notes:'',photo:''});added++});if(!added)return alert('Agregá al menos un producto.');await saveState();closeModal();render();alert('Se cargaron '+added+' productos.');}
function searchView(){let q=searchText.trim().toLowerCase();let ps=q?state.products.filter(p=>[p.model,p.name,p.brand,p.category,p.supplierName].some(v=>String(v||'').toLowerCase().includes(q))):[];let result='';if(q){result='<div class="row"><h2>Resultados ('+ps.length+')</h2><button class="secondary" onclick="productForm()">+ Agregar producto</button></div><div class="product-list">'+(ps.length?ps.map(productRow).join(''):'<div class="panel empty">No encontramos productos.</div>')+'</div>'}return '<div class="panel"><div class="row"><div><h2 class="sectiontitle">Buscador central</h2><div class="muted">Busca por modelo, producto, marca, clasificación o proveedor.</div></div><button class="primary" onclick="supplierForm()">+ Nuevo proveedor</button></div><div class="toolbar"><input class="search" value="'+esc(searchText)+'" oninput="searchText=this.value;render()" placeholder="🔎 Buscar producto, marca, proveedor o modelo…"></div><div class="notice">Los productos guardados no se muestran hasta realizar una búsqueda.</div></div>'+catalogPanel()+result}
function catalogPanel(){return '<div class="panel"><div class="row"><div><b>Cargar catálogo</b><div class="muted">Excel o CSV · revisión antes de guardar.</div></div><button class="secondary" onclick="document.getElementById(\'catalogfile\').click()">📚 Subir catálogo</button></div><input id="catalogfile" type="file" accept=".xlsx,.xls,.csv" style="display:none" onchange="handleCatalogFile(this.files[0])"></div>'}
function productRow(p){let s=state.suppliers.find(x=>x.id===p.supplierId);return '<button class="product-row" onclick="productDetail(\''+p.id+'\')"><span>'+esc(p.category||'Sin clasificación')+'</span><strong>'+esc(p.model||p.name||'Sin modelo')+'</strong><span>'+esc(p.supplierName||s?.name||'Sin proveedor')+'</span></button>'}
function productDetail(pid){let p=state.products.find(x=>x.id===pid);if(!p)return;let s=state.suppliers.find(x=>x.id===p.supplierId),rate=Number(p.rate??s?.rate??0),ars=p.priceMode==='ars'?Number(p.arsPrice||0):Number(p.usd||0)*rate;let price=p.priceMode==='ars'?'<div><b>Pesos (ARS):</b> $ '+money(p.arsPrice)+'</div>':'<div><b>Dólar (USD):</b> US$ '+money(p.usd)+'</div><div><b>Tasa de cambio:</b> $ '+money(rate)+'</div><div><b>Pesos (ARS):</b> $ '+money(ars)+'</div>';openModal('<div class="product-detail">'+(p.photo?'<img src="'+esc(p.photo)+'" class="detail-photo">':'')+'<h2>'+esc(p.model||p.name||'Producto')+'</h2><div class="detail-grid"><div><b>Clasificación</b><br>'+esc(p.category||'-')+'</div><div><b>Proveedor</b><br>'+esc(p.supplierName||s?.name||'-')+'</div><div><b>Marca</b><br>'+esc(p.brand||'-')+'</div><div><b>Calidad</b><br>'+esc(p.quality||'-')+'</div><div><b>Precio</b><br>'+price+'</div><div><b>Tiempo de despacho</b><br>'+esc(p.dispatch||'-')+'</div><div><b>Cuenta corriente</b><br>'+(s?.account?'Sí':'No')+'</div><div><b>Descuento</b><br>'+(s?.discountEnabled?'Sí · '+esc(s.discountPercent||'0')+'%':'No')+'</div></div><div class="panel"><b>Observaciones</b><br>'+esc(p.notes||'-')+'</div></div><div class="row"><button class="secondary" onclick="closeModal();productForm(\''+p.id+'\')">✏️ Editar</button><button class="danger" onclick="closeModal();deleteProduct(\''+p.id+'\')">🗑️ Eliminar</button><button class="primary" onclick="closeModal()">Cerrar</button></div>')}

async function loadPdfJs(){if(window._pdfjs)return window._pdfjs;window._pdfjs=await import('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.5.136/pdf.min.mjs');window._pdfjs.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.5.136/pdf.worker.min.mjs';return window._pdfjs}
async function extractPdfText(file){let pdfjs=await loadPdfJs(),buf=await file.arrayBuffer(),pdf=await pdfjs.getDocument({data:buf}).promise,out='';for(let i=1;i<=pdf.numPages;i++){let page=await pdf.getPage(i),c=await page.getTextContent();out+='\n'+c.items.map(x=>x.str).join(' ')}return out}
function parseOrderLines(text){return[]}
async function parseOrderPdf(){
let f=document.getElementById('opdf').files[0];
if(!f)return alert('Selecciona un PDF.');
try{
 const pdfjs=await loadPdfJs(),buf=await f.arrayBuffer(),pdf=await pdfjs.getDocument({data:buf}).promise,lines=[];
 for(let pn=1;pn<=pdf.numPages;pn++){
  const page=await pdf.getPage(pn),c=await page.getTextContent();
  const items=c.items.map(x=>{let tr=x.transform||[];return{text:String(x.str||'').trim(),x:Number(tr[4]||0),y:Number(tr[5]||0)}}).filter(x=>x.text);

  // MODELO: las celdas del PDF están centradas verticalmente sobre sus filas de color.
  const modelGroups={};
  items.filter(it=>it.x>=110&&it.x<220&&it.y>45).forEach(it=>{
   let key=Object.keys(modelGroups).find(k=>Math.abs(Number(k)-it.y)<=2.5);
   if(!key){key=String(it.y);modelGroups[key]=[];}
   modelGroups[key].push(it);
  });
  const models=Object.keys(modelGroups).map(k=>({
   y:Number(k),
   text:modelGroups[k].sort((a,b)=>a.x-b.x).map(x=>x.text).join(' ')
  })).filter(m=>m.text).sort((a,b)=>a.y-b.y);

  const colorGroups={};
  items.filter(it=>it.x>=220&&it.x<285&&it.y>45).forEach(it=>{
   let key=Object.keys(colorGroups).find(k=>Math.abs(Number(k)-it.y)<=2.5);
   if(!key){key=String(it.y);colorGroups[key]=[];}
   colorGroups[key].push(it);
  });
  const colorRows=Object.keys(colorGroups).map(k=>({
   y:Number(k),color:colorGroups[k].sort((a,b)=>a.x-b.x).map(x=>x.text).join(' ')
  })).sort((a,b)=>a.y-b.y);

  const orderGroups={};
  items.filter(it=>it.x>=285&&it.x<350&&it.y>45&&/^\d+$/.test(it.text)).forEach(it=>{
   let key=Object.keys(orderGroups).find(k=>Math.abs(Number(k)-it.y)<=3);
   if(!key)key=String(it.y);
   orderGroups[key]=Number(it.text);
  });
  const orderRows=Object.keys(orderGroups).map(k=>({y:Number(k),qty:orderGroups[k]}));

  let unit=1.5;
  const header=items.find(it=>/^USD\s*1[.,]5$/i.test(it.text));
  if(header){const m=header.text.match(/1[.,]5/);if(m)unit=Number(m[0].replace(',','.'));}

  // Asigna cada bloque de colores al modelo cuya celda ocupa exactamente ese bloque.
  // Esto evita el error anterior que asignaba los primeros colores de S26FE a S25ULTRA.
  let colorIndex=0;
  for(let mi=0;mi<models.length && colorIndex<colorRows.length;mi++){
   const model=models[mi];
   let chosenEnd=-1;
   for(let end=colorIndex;end<colorRows.length;end++){
    const midpoint=(colorRows[colorIndex].y+colorRows[end].y)/2;
    const centerError=Math.abs(midpoint-model.y);
    if(centerError<=8){
      if(chosenEnd<0 || centerError < Math.abs(((colorRows[colorIndex].y+colorRows[chosenEnd].y)/2)-model.y)) chosenEnd=end;
    }
    if(midpoint>model.y+9)break;
   }
   if(chosenEnd<0)continue;
   for(let ri=colorIndex;ri<=chosenEnd;ri++){
    const row=colorRows[ri];
    const qtyEntry=orderRows.find(o=>Math.abs(o.y-row.y)<=3);
    if(!qtyEntry||!qtyEntry.qty)continue;
    lines.push({
      product:model.text+' · '+row.color,
      model:model.text,
      color:row.color,
      qty:qtyEntry.qty,
      unitPrice:unit,
      subtotal:qtyEntry.qty*unit,
      page:pn
    });
   }
   colorIndex=chosenEnd+1;
  }
 }
 pendingOrderLines=lines;
 renderPendingOrder();
}catch(e){alert('No se pudo leer el PDF: '+e.message)}
}
function syncPendingInputs(){document.querySelectorAll('#parsedorder [data-i]').forEach(el=>{let i=Number(el.dataset.i);if(!pendingOrderLines[i])return;let k=el.dataset.k;pendingOrderLines[i][k]=(k==='qty'||k==='unitPrice')?Number(el.value||0):el.value});pendingOrderLines=pendingOrderLines.filter(l=>String(l.model||'').trim()||String(l.color||'').trim()||Number(l.qty||0));pendingOrderLines.forEach(l=>{l.product=(l.color?String(l.model||'')+' · '+String(l.color):String(l.model||''));l.subtotal=Number(l.qty||0)*Number(l.unitPrice||0)});}
function renderPendingOrder(){let html='<h3>Artículos detectados ('+pendingOrderLines.length+')</h3><div class="notice">Puedes corregir aquí el modelo, color, cantidad y precio. Estos cambios solo modifican el registro del pedido; <b>el PDF original se guarda exactamente igual al archivo que subiste.</b></div>';if(!pendingOrderLines.length)html+='<div class="notice warning">No se detectaron artículos. Puedes agregar uno manualmente.</div>';pendingOrderLines.forEach((l,i)=>{html+='<div class="orderline" data-pending-line="'+i+'"><div class="grid2"><div class="field"><label>Producto/modelo</label><input data-i="'+i+'" data-k="model" value="'+esc(l.model||'')+'" oninput="syncPendingInputs()"></div><div class="field"><label>Color</label><input data-i="'+i+'" data-k="color" value="'+esc(l.color||'')+'" oninput="syncPendingInputs()"></div></div><div class="grid2"><div class="field"><label>Cantidad</label><input data-i="'+i+'" data-k="qty" type="number" min="0" value="'+Number(l.qty||0)+'" oninput="syncPendingInputs()"></div><div class="field"><label>Precio unitario</label><input data-i="'+i+'" data-k="unitPrice" type="number" min="0" step="0.01" value="'+Number(l.unitPrice||0)+'" oninput="syncPendingInputs()"></div></div><button class="danger small" onclick="removePendingLine('+i+')">Eliminar artículo</button></div>'});html+='<button class="secondary" onclick="addPendingLine()">＋ Agregar artículo</button>';document.getElementById('parsedorder').innerHTML=html}
function addPendingLine(){syncPendingInputs();pendingOrderLines.push({model:'',color:'',qty:1,unitPrice:0,subtotal:0});renderPendingOrder()}
function removePendingLine(i){syncPendingInputs();pendingOrderLines.splice(i,1);renderPendingOrder()}
async function saveOrder(){syncPendingInputs();let supplierId=document.getElementById('osupplier').value,date=document.getElementById('odate').value,f=document.getElementById('opdf').files[0];if(!f)return alert('Selecciona el PDF original.');document.querySelectorAll('#parsedorder [data-i]').forEach(el=>{let i=Number(el.dataset.i);pendingOrderLines[i][el.dataset.k]=el.dataset.k==='model'?el.value:Number(el.value)});pendingOrderLines=pendingOrderLines.map(l=>Object.assign({},l,{subtotal:Number(l.qty||0)*Number(l.unitPrice||0)}));let total=pendingOrderLines.reduce((a,l)=>a+l.subtotal,0),orderId=uid(),path=session.user.id+'/'+orderId+'.pdf';
// IMPORTANTE: el PDF original se sube directamente como archivo binario, sin reconstruirlo, editarlo ni convertirlo.
// El parser solo lee una copia en memoria para detectar los artículos; nunca se guarda el resultado como PDF.
let originalBytes=await f.arrayBuffer();let originalBlob=new Blob([originalBytes],{type:f.type||'application/pdf'});let up=await api('/storage/v1/object/order-pdfs/'+path.split('/').map(encodeURIComponent).join('/'),{method:'POST',headers:{'apikey':SUPABASE_KEY,'Authorization':'Bearer '+session.access_token,'Content-Type':f.type||'application/pdf','x-upsert':'false'},body:originalBlob});if(!up.ok)return alert('No se pudo subir el PDF original: '+await up.text());
let hash='';try{let digest=await crypto.subtle.digest('SHA-256',originalBytes);hash=Array.from(new Uint8Array(digest)).map(b=>b.toString(16).padStart(2,'0')).join('')}catch(e){}
let s=state.suppliers.find(x=>x.id===supplierId);state.orders.push({id:orderId,supplierId,supplierName:s.name,date,lines:pendingOrderLines,total,pdfPath:path,fileName:f.name,originalFileName:f.name,originalMimeType:f.type||'application/pdf',originalSize:f.size,originalLastModified:f.lastModified||null,originalSha256:hash});await saveState();closeModal();render()}
async function getOriginalPdfBlob(o){
if(!o||!o.pdfPath)throw new Error('Este pedido no tiene un PDF original guardado.');
if(!session||!session.access_token)throw new Error('La sesión no está activa. Inicia sesión nuevamente.');
let path=o.pdfPath.split('/').map(encodeURIComponent).join('/');
let headers={'apikey':SUPABASE_KEY,'Authorization':'Bearer '+session.access_token};
// Bucket privado: descarga el objeto original usando la sesión autenticada.
let r=await fetch(SUPABASE_URL+'/storage/v1/object/authenticated/order-pdfs/'+path,{method:'GET',headers,cache:'no-store'});
if(!r.ok){
  // Respaldo: URL firmada para el mismo objeto, sin cambiar sus bytes.
  let sr=await fetch(SUPABASE_URL+'/storage/v1/object/sign/order-pdfs/'+path,{method:'POST',headers:{...headers,'Content-Type':'application/json'},body:JSON.stringify({expiresIn:300})});
  if(sr.ok){
    let sj=await sr.json();
    let signed=sj.signedURL||sj.signedUrl||sj.url;
    if(signed){if(signed.startsWith('/'))signed=SUPABASE_URL+signed;r=await fetch(signed,{method:'GET',cache:'no-store'});}
  }
}
if(!r.ok)throw new Error('No se pudo recuperar el PDF original ('+r.status+').');
let blob=await r.blob();
if(blob.type && !blob.type.toLowerCase().includes('pdf'))throw new Error('El archivo recuperado no es un PDF.');
return blob
}

let blob=await getOriginalPdfBlob(o);
let u=URL.createObjectURL(new Blob([blob],{type:'application/pdf'}));
openModal('<h2>PDF original</h2><div class="notice success">Este es el archivo PDF original guardado. No se modifica ni se reconstruye.</div><iframe src="'+u+'" style="width:100%;height:70vh;border:1px solid var(--line);border-radius:12px;background:#fff"></iframe><div class="row" style="margin-top:12px"><button class="secondary" onclick="closeModal()">Cerrar</button></div>');
document.getElementById('modal').dataset.pdfObjectUrl=u;
}catch(e){alert(e.message)}}
async function downloadOriginalPdf(oid){let o=state.orders.find(x=>x.id===oid);try{let blob=await getOriginalPdfBlob(o);let u=URL.createObjectURL(new Blob([blob],{type:'application/pdf'}));let a=document.createElement('a');a.href=u;a.download=o.originalFileName||o.fileName||'pedido-original.pdf';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),60000)}catch(e){alert(e.message)}}
function openOrder(oid){let o=state.orders.find(x=>x.id===oid);if(!o)return;let rows=(o.lines||[]).map(l=>'<tr><td>'+esc(l.model||l.product)+'</td><td>'+esc(l.color||'')+'</td><td>'+esc(l.qty)+'</td><td>$ '+money(l.unitPrice)+'</td><td>$ '+money(l.subtotal)+'</td></tr>').join('');openModal('<h2>Pedido · '+esc(o.date)+'</h2><p><b>Proveedor:</b> '+esc(o.supplierName)+'</p><div class="notice">Puedes modificar las cantidades, artículos, proveedor o fecha. El <b>PDF original permanece guardado sin cambios</b>.</div><div class="tablewrap"><table class="table"><thead><tr><th>Artículo</th><th>Color</th><th>Cantidad</th><th>Unitario</th><th>Subtotal</th></tr></thead><tbody>'+rows+'</tbody></table></div><h3>Total: $ '+money(o.total)+'</h3><div class="row"><button class="secondary" onclick="editOrder(\''+o.id+'\')">✏️ Modificar pedido</button>'+(o.pdfPath?'<button class="secondary" onclick="openPdf(\''+o.id+'\')">📄 Ver PDF original</button><button class="secondary" onclick="downloadOriginalPdf(\''+o.id+'\')">⬇️ Descargar original</button>':'')+'<button class="secondary" onclick="closeModal()">Cerrar</button></div>')}
function editOrder(oid){let o=state.orders.find(x=>x.id===oid);if(!o)return;let opts=state.suppliers.map(s=>'<option value="'+s.id+'" '+(s.id===o.supplierId?'selected':'')+'>'+esc(s.name)+'</option>').join('');let rows=(o.lines||[]).map((l,i)=>editOrderRow(l,i)).join('');openModal('<h2>Modificar pedido</h2><div class="notice">Los cambios afectan el registro del pedido, pero <b>no modifican ni reemplazan el PDF original</b>.</div><div class="grid2"><div class="field"><label>Proveedor</label><select id="editSupplier">'+opts+'</select></div><div class="field"><label>Fecha de compra</label><input id="editDate" type="date" value="'+esc(o.date||'')+'"></div></div><h3>Artículos</h3><div id="editOrderLines" class="list">'+rows+'</div><button class="secondary" onclick="addEditOrderLine()">＋ Agregar artículo</button><div class="row" style="margin-top:15px"><b>Total: $ <span id="editTotal">'+money(o.total)+'</span></b><span></span></div><div class="row" style="margin-top:12px"><button class="secondary" onclick="closeModal()">Cancelar</button><button class="primary" onclick="saveEditedOrder(\''+o.id+'\')">Guardar cambios</button></div>')} 
function editOrderRow(l,i){return '<div class="orderline" data-edit-line="'+i+'"><div class="grid3"><div class="field"><label>Modelo / producto</label><input data-ek="model" value="'+esc(l.model||l.product||'')+'"></div><div class="field"><label>Color</label><input data-ek="color" value="'+esc(l.color||'')+'"></div><div class="field"><label>Cantidad</label><input data-ek="qty" type="number" min="0" value="'+Number(l.qty||0)+'" oninput="recalcEditOrder()"></div></div><div class="grid2"><div class="field"><label>Precio unitario</label><input data-ek="unitPrice" type="number" min="0" step="0.01" value="'+Number(l.unitPrice||0)+'" oninput="recalcEditOrder()"></div><div style="display:flex;align-items:end"><button class="danger small" onclick="this.closest(\'[data-edit-line]\').remove();recalcEditOrder()">Eliminar artículo</button></div></div></div>'} 
function addEditOrderLine(){let box=document.getElementById('editOrderLines');if(!box)return;let i=box.querySelectorAll('[data-edit-line]').length;box.insertAdjacentHTML('beforeend',editOrderRow({model:'',color:'',qty:1,unitPrice:0},i));recalcEditOrder()} 
function recalcEditOrder(){let total=0;document.querySelectorAll('#editOrderLines [data-edit-line]').forEach(r=>{let q=Number(r.querySelector('[data-ek="qty"]').value||0),u=Number(r.querySelector('[data-ek="unitPrice"]').value||0);total+=q*u});let el=document.getElementById('editTotal');if(el)el.textContent=money(total)} 
async function saveEditedOrder(oid){let o=state.orders.find(x=>x.id===oid);if(!o)return;let supplierId=document.getElementById('editSupplier').value,date=document.getElementById('editDate').value,s=state.suppliers.find(x=>x.id===supplierId);if(!s)return alert('Selecciona un proveedor.');let lines=[...document.querySelectorAll('#editOrderLines [data-edit-line]')].map(r=>{let model=r.querySelector('[data-ek="model"]').value.trim(),color=r.querySelector('[data-ek="color"]').value.trim(),qty=Number(r.querySelector('[data-ek="qty"]').value||0),unitPrice=Number(r.querySelector('[data-ek="unitPrice"]').value||0);return{model,color,product:color?model+' · '+color:model,qty,unitPrice,subtotal:qty*unitPrice}}).filter(l=>l.model&&l.qty>0);if(!lines.length)return alert('Agrega al menos un artículo con cantidad.');o.supplierId=supplierId;o.supplierName=s.name;o.date=date;o.lines=lines;o.total=lines.reduce((a,l)=>a+l.subtotal,0);await saveState();closeModal();render()} 

async function deleteOrder(oid){let o=state.orders.find(x=>x.id===oid);if(!o||!confirm('¿Eliminar este pedido y su PDF?'))return;if(o.pdfPath)await api('/storage/v1/object/order-pdfs/'+o.pdfPath.split('/').map(encodeURIComponent).join('/'),{method:'DELETE',headers:authHeaders(session.access_token)});state.orders=state.orders.filter(x=>x.id!==oid);await saveState();render()}
function stockView(){let cats=['Vidrios','Fundas','Tablets','Notebooks','Accesorios','Varios'];let cards=cats.map(c=>{let xs=state.stock.filter(x=>x.category===c);return '<div class="card"><h3>'+c+'</h3>'+(xs.length?xs.map(stockItem).join(''):'<div class="muted">Sin registros.</div>')+'</div>'}).join('');return '<div class="row"><div><h2>Control de Stock</h2><div class="muted">Registra existencias y estado actual. No genera pedidos automáticos.</div></div><button class="primary" onclick="stockForm()">+ Registrar stock</button></div><div class="cards">'+cards+'</div>'}
function stockItem(x){let cls=x.qty>0?'stock-green':x.status==='Necesitamos'?'stock-yellow':'stock-red';return '<div class="orderline"><div class="row"><b>'+esc(x.model)+'</b><span class="'+cls+'">● '+esc(x.status)+'</span></div><div>Cantidad: '+esc(x.qty)+' · '+esc(x.supplierName||'')+'</div><button class="danger small" onclick="deleteStock(\''+x.id+'\')">Eliminar</button></div>'}
function stockForm(){let cats=['Vidrios','Fundas','Tablets','Notebooks','Accesorios','Varios'].map(x=>'<option>'+x+'</option>').join(''),sup=state.suppliers.map(s=>'<option value="'+s.id+'">'+esc(s.name)+'</option>').join('');openModal('<h2>Registrar stock</h2><div class="grid2"><div class="field"><label>Categoría</label><select id="stcat">'+cats+'</select></div><div class="field"><label>Producto/modelo</label><input id="stmodel"></div><div class="field"><label>Cantidad</label><input id="stqty" type="number" value="0"></div><div class="field"><label>Estado</label><select id="ststatus"><option>Stock suficiente</option><option>Necesitamos</option><option>Sin stock</option></select></div></div><div class="field"><label>Proveedor relacionado (opcional)</label><select id="stsupplier"><option value="">—</option>'+sup+'</select></div><div class="row"><button class="secondary" onclick="closeModal()">Cancelar</button><button class="primary" onclick="saveStock()">Guardar</button></div>')}
async function saveStock(){let sid=document.getElementById('stsupplier').value,s=state.suppliers.find(x=>x.id===sid);state.stock.push({id:uid(),category:document.getElementById('stcat').value,model:document.getElementById('stmodel').value.trim(),qty:Number(document.getElementById('stqty').value||0),status:document.getElementById('ststatus').value,supplierId:sid,supplierName:s?.name||''});await saveState();closeModal();render()}
async function deleteStock(x){state.stock=state.stock.filter(s=>s.id!==x);await saveState();render()}
async function handleCatalogFile(file){if(!file)return;let rows=[];if(/\.xlsx?$/i.test(file.name)){await loadScript('https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js','XLSX');let wb=XLSX.read(await file.arrayBuffer(),{type:'array'});wb.SheetNames.forEach(sn=>rows.push(...XLSX.utils.sheet_to_json(wb.Sheets[sn],{defval:''})))}else if(/\.csv$/i.test(file.name)){await loadScript('https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js','XLSX');let wb=XLSX.read(await file.text(),{type:'string'});rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:''})}else{return alert('Formato no compatible. Usa Excel o CSV para catálogo.')};showCatalogPreview(rows,file.name)}
function showCatalogPreview(rows,name){if(!state.suppliers.length)return alert('Primero crea un proveedor.');let opts=state.suppliers.map(s=>'<option value="'+s.id+'">'+esc(s.name)+'</option>').join(''),mapped=rows.map(r=>{let vals=Object.values(r).map(v=>String(v).trim()).filter(Boolean),joined=vals.join(' | '),m=joined.match(/(?:USD|U\$|US\$|\$)\s*([0-9]+(?:[.,][0-9]+)?)/i);return{model:vals[0]||'',brand:vals[1]||'',usd:m?m[1].replace(',','.'):'',raw:joined}}).filter(x=>x.model);let list=mapped.slice(0,300).map((x,i)=>'<div class="orderline" data-catrow="'+i+'"><div class="grid3"><input data-k="model" value="'+esc(x.model)+'"><input data-k="brand" value="'+esc(x.brand)+'"><input data-k="usd" type="number" step="0.01" value="'+esc(x.usd)+'"></div><div class="muted" style="margin-top:5px">'+esc(x.raw)+'</div><button class="danger small" onclick="this.closest(\'[data-catrow]\').remove()">Eliminar</button></div>').join('');openModal('<h2>Revisar catálogo · '+esc(name)+'</h2><div class="field"><label>Proveedor</label><select id="catSupplier">'+opts+'</select></div><div class="notice">Revisa las filas antes de guardar. Las filas incorrectas se pueden eliminar.</div><div id="catrows" class="list">'+list+'</div><div class="row" style="margin-top:15px"><button class="secondary" onclick="closeModal()">Cancelar</button><button class="primary" onclick="saveCatalogPreview()">Guardar catálogo</button></div>')}
async function saveCatalogPreview(){let supplierId=document.getElementById('catSupplier').value,s=state.suppliers.find(x=>x.id===supplierId),rows=[...document.querySelectorAll('[data-catrow]')].map(r=>{let g=k=>r.querySelector('[data-k="'+k+'"]').value;return{id:uid(),supplierId,supplierName:s.name,model:g('model'),name:g('model'),brand:g('brand'),category:'Varios',quality:'Media',priceMode:'usd',usd:g('usd'),rate:Number(s.rate||0),arsPrice:'',dispatch:'',notes:'',photo:''}}).filter(x=>x.model);state.products.push(...rows);await saveState();closeModal();render()}
restoreSession();
</script>

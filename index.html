<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Proveedores | Sistema interno — Catálogos automáticos</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--text:#182230;--muted:#667085;--line:#e5e7eb;--accent:#2563eb;--green:#16a34a;--yellow:#ca8a04;--red:#dc2626}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
header{background:#111827;color:#fff;padding:16px 28px;display:flex;justify-content:space-between;align-items:center;gap:16px}
header h1{margin:0;font-size:22px}.brand{display:flex;align-items:center;gap:14px}.brand img{width:88px;height:58px;object-fit:contain;background:#fff;border-radius:10px;padding:4px}.brandtext{display:flex;flex-direction:column;gap:3px}header span{color:#cbd5e1;font-size:13px}
main{max-width:1250px;margin:0 auto;padding:28px}
.toolbar{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:22px}
.search{flex:1;min-width:260px;padding:14px 16px;border:1px solid var(--line);border-radius:12px;font-size:16px;background:#fff}
button{border:0;border-radius:10px;padding:12px 16px;font-weight:700;cursor:pointer}
.primary{background:var(--accent);color:white}.secondary{background:#fff;border:1px solid var(--line);color:var(--text)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px}
.stat{background:var(--card);padding:18px;border:1px solid var(--line);border-radius:14px}.stat b{display:block;font-size:25px}.stat small{color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.table-wrap{overflow:auto;-webkit-overflow-scrolling:touch}table{width:100%;min-width:1200px;border-collapse:collapse}th,td{padding:13px 14px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}th{font-size:12px;text-transform:uppercase;color:var(--muted);background:#f8fafc}td{font-size:14px}
.badge{display:inline-block;padding:5px 9px;border-radius:999px;font-size:12px;font-weight:800}.alta{background:#dcfce7;color:#166534}.media{background:#fef9c3;color:#854d0e}.baja{background:#fee2e2;color:#991b1b}
.modal{display:none;position:fixed;inset:0;background:rgba(15,23,42,.5);align-items:center;justify-content:center;padding:18px;z-index:10}.modal.open{display:flex}
.modalbox{background:#fff;border-radius:18px;width:min(760px,100%);max-height:92vh;overflow:auto;padding:24px}.modalhead{display:flex;justify-content:space-between;align-items:center}.modalhead h2{margin:0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{display:flex;flex-direction:column;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:13px;font-weight:700}.field input,.field select,.field textarea{padding:11px;border:1px solid var(--line);border-radius:10px;font:inherit}.field textarea{min-height:80px;resize:vertical}
.preview{width:100%;max-height:180px;object-fit:contain;border:1px dashed var(--line);border-radius:10px;margin-top:5px;display:none}.actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}
.provider-list{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}.provider{background:#fff;border:1px solid var(--line);padding:9px 12px;border-radius:10px;cursor:pointer}.provider.active{border-color:var(--accent);color:var(--accent);font-weight:800}
.empty{text-align:center;padding:45px;color:var(--muted)}
@media(max-width:800px){.stats{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.field.full{grid-column:auto}}
</style>

<style id="ddc-two-products-row">
/* Solo cambia la distribución visual de los productos */
.product-grid, .products-grid, .products, .catalog-grid, .product-list {
  display: grid !important;
  grid-template-columns: repeat(2, minmax(0, 1fr)) !important;
  gap: 18px !important;
}
@media (max-width: 700px) {
  .product-grid, .products-grid, .products, .catalog-grid, .product-list {
    grid-template-columns: 1fr !important;
  }
}
</style>

<style id="supabase-login-style">
#loginScreen{position:fixed;inset:0;background:linear-gradient(135deg,#111827,#1f2937);display:flex;align-items:center;justify-content:center;padding:20px;z-index:9999}
#loginCard{background:#fff;width:min(430px,100%);border-radius:20px;padding:28px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
#loginCard h2{margin:0 0 8px}.login-sub{color:#667085;margin:0 0 22px}.login-field{margin-bottom:14px}.login-field label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}.login-field input{width:100%;padding:13px;border:1px solid #d0d5dd;border-radius:10px;font-size:16px;box-sizing:border-box}.login-btn{width:100%;background:#2563eb;color:#fff;border:0;border-radius:10px;padding:13px;font-weight:800;font-size:16px}.login-msg{min-height:22px;margin-top:12px;font-size:14px;color:#b42318}.cloud-status{font-size:12px;color:#cbd5e1;margin-top:3px}
</style>

<style id="ddc-final-ui">
.product-table{min-width:0 !important}
.product-table th,.product-table td{white-space:normal !important;padding:16px 14px}
.product-table th{font-size:13px}
.product-row{cursor:pointer;transition:background .15s}
.product-row:hover{background:#f8fafc}
.product-row td{font-size:15px}
.detail-box{width:min(680px,100%)}
.detail-photo{display:block;width:100%;max-height:300px;object-fit:contain;border-radius:14px;background:#f8fafc;margin:0 0 18px}
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.detail-grid>div{background:#f8fafc;border-radius:12px;padding:12px}
.detail-grid span{display:block;color:#667085;font-size:12px;margin-bottom:4px}
.detail-grid b{font-size:14px}
.detail-full{grid-column:1/-1}
@media(max-width:700px){.detail-grid{grid-template-columns:1fr}.detail-full{grid-column:auto}}
.brand img{background:transparent !important;padding:0 !important;border-radius:0 !important;width:112px !important;height:64px !important}
@media(max-width:700px){.brand img{width:92px !important;height:56px !important}}
</style>

</head>
<body>
<div id="loginScreen">
  <div id="loginCard">
    <h2>DDC Yeshua</h2>
    <p class="login-sub">Ingresá para acceder a los proveedores y catálogos compartidos.</p>
    <div class="login-field"><label>Correo</label><input id="loginEmail" type="email" autocomplete="username" placeholder="correo@ejemplo.com"></div>
    <div class="login-field"><label>Contraseña</label><input id="loginPassword" type="password" autocomplete="current-password" placeholder="Tu contraseña"></div>
    <button class="login-btn" onclick="loginDDC()">Ingresar</button>
    <div id="loginMsg" class="login-msg"></div>
  </div>
</div>

async function loginDDC(){
 const email=document.getElementById('loginEmail').value.trim();
 const password=document.getElementById('loginPassword').value;
 const msg=document.getElementById('loginMsg');
 if(!email||!password){msg.textContent='Ingresá correo y contraseña.';return;}

 msg.textContent='';
}
async function initCloud(){
 const {data:{session}}=await supabaseClient.auth.getSession();
 if(!session){document.getElementById('loginScreen').style.display='flex';return;}
 await loadCloudData();
 document.getElementById('loginScreen').style.display='none';
 render();
}
supabaseClient.auth.onAuthStateChange(async (event,session)=>{
 if(session){
   document.getElementById('loginScreen').style.display='none';
   if(!cloudReady) await loadCloudData();
   render();
 }else{
   document.getElementById('loginScreen').style.display='flex';
 }
});

 data=normalizeData(data);
 localStorage.setItem(KEY,JSON.stringify(data));

function providerRate(name){ return data.providerRates[name]||''; }
function setProviderRate(name,rate){ if(rate) data.providerRates[name]=String(rate); else delete data.providerRates[name]; data.products.forEach(p=>{if(p.provider===name){p.dollarRate=String(rate||'');p.priceARS=arsFromUsd(p.priceUSD,rate)}}); }
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function money(v){return v?('$'+Number(v).toLocaleString('es-AR')):'—'}
function arsFromUsd(usd,rate){const a=Number(usd)||0,r=Number(rate)||0;return a&&r?a*r:0}
function priceLabel(p){return p.priceUSD?`USD ${Number(p.priceUSD).toLocaleString('es-AR',{minimumFractionDigits:2,maximumFractionDigits:2})}`:money(p.price)}

       .filter(x=>[x.p.provider,x.p.product,x.p.brand,x.p.general,x.p.classification].join(' ').toLowerCase().includes(q))
   : [];

 <button class="secondary" title="Eliminar proveedor" onclick="deleteProvider(${i})">🗑️</button>
 </div>`).join('');

 document.getElementById('results').innerHTML=products.length
   ? products.map(({p,i})=>`<tr class="product-row" onclick="openProductDetail(${i})">
       <td>${esc(p.classification || p.general || '—')}</td>

function detectProviderFromText(text){
 const t=String(text||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
 let best=null;
 data.providers.forEach((name,idx)=>{
   const n=String(name).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
   if(n.length>=3 && t.includes(n)) best={name,idx};
 });
 return best;
}

   else if(ext==='txt'){const text=await file.text(); providerMatch=providerMatch||detectProviderFromText(text.slice(0,15000)); importedCatalog.push(...parseLooseText(text));}
   else if(ext==='json'){const text=await file.text(); const obj=JSON.parse(text); const rows=Array.isArray(obj)?obj:(obj.products||obj.productos||[]); providerMatch=providerMatch||detectProviderFromText(JSON.stringify(obj).slice(0,15000)); importedCatalog.push(...mapCatalogRows(rows));}
   else if(['jpg','jpeg','png','webp'].includes(ext)){const r=await OCRImage(file); providerMatch=providerMatch||detectProviderFromText(r.text.slice(0,15000)); importedCatalog.push(...parseLooseText(r.text));}
  }

async function OCRImage(file){
 const status=document.getElementById('catalogStatus'); status.textContent=`Leyendo imagen con OCR: ${file.name}…`;
 const r=await Tesseract.recognize(file,'spa+eng',{logger:m=>{if(m.status==='recognizing text')status.textContent=`Leyendo imagen… ${Math.round((m.progress||0)*100)}%`;}});
 return {text:r.data.text||''};
}
function parseLooseText(text){
 const lines=String(text||'').split(/\r?\n/).map(x=>x.trim()).filter(Boolean); const out=[];
 lines.forEach(line=>{const price=line.match(/(?:USD|US\$|\$)\s*([0-9]+(?:[.,][0-9]+)?)/i); const m=line.match(/(?:USD|US\$)\s*([0-9]+(?:[.,][0-9]+)?)/i); if(price||m){const raw=(m?m[1]:price[1]).replace(/\./g,'').replace(',','.'); const product=line.replace(price?price[0]:'','').trim(); if(product.length>1) out.push({product,price:'',priceUSD:raw,general:'Varios',classification:'',brand:'',quality:'Media',dollarRate:'',priceARS:0,dispatch:'',currentAccount:'No',discount:'No',percent:'0',obs:''});}});
 return out;
}
function normKey(k){return String(k||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]/g,'')}
function mapCatalogRows(rows){return rows.map(r=>{const m={}; Object.keys(r).forEach(k=>m[normKey(k)]=r[k]); return {product:String(m.producto||m.nombre||m.descripcion||m.item||'').trim(),general:String(m.general||'Varios').trim(),classification:String(m.clasificacion||m.tipo||m.category||'').trim(),brand:String(m.marca||m.brand||'').trim(),quality:String(m.calidad||m.quality||'Media').trim(),price:'',priceUSD:String(m.usd||m.preciousd||m.preciousdolares||'').replace(/[^0-9.,]/g,'').replace(',','.'),dollarRate:String(m.tasa||m.tasadolar||m.tipodecambio||'').replace(/[^0-9.,]/g,'').replace(',','.'),priceARS:0,dispatch:String(m.despacho||m.tiempodedespacho||'').trim(),currentAccount:String(m.cuentacorriente||m.cuenta||'No').trim(),discount:String(m.descuento||'No').trim(),percent:String(m.porcentajedescuento||m.porcentaje||'0').replace('%','').trim(),obs:String(m.observaciones||m.obs||'').trim()};}).filter(x=>x.product)}

function parseNumFromCatalog(v){
 if(v===null||v===undefined||v==='') return '';
 if(typeof v==='number') return String(v);
 const s=String(v).trim();
 const m=s.match(/(?:USD|US\$|U\$D?|U\$|\$)\s*([0-9]+(?:[.,][0-9]+)?(?:\s*[-/]\s*[0-9]+(?:[.,][0-9]+)?)?)/i);
 if(m) return m[1].replace(/\s+/g,'').replace(/,/g,'.');
 const n=s.match(/([0-9]+(?:[.,][0-9]+)?)/);
 return n?n[1].replace(/,/g,'.'):'';
}
function makeImported(product,general,classification,brand,quality,usd,dispatch){
 const priceUSD=parseNumFromCatalog(usd);
 return {product:String(product||'').replace(/\s+/g,' ').trim(),general:general||'Varios',classification:classification||'',brand:brand||'',quality:quality||'Media',price:'',priceUSD,dollarRate:'',priceARS:0,dispatch:dispatch||'',currentAccount:'No',discount:'No',percent:'0',obs:''};
}
function sheetGeneral(name){
 const n=String(name||'').toLowerCase();
 if(n.includes('silicona')||n.includes('funda')) return 'Fundas';
 if(n.includes('templado')||n.includes('antiespia')||n.includes('9d')||n==='2d'||n.includes('curvo')||n.includes('uv')) return 'Vidrios';
 if(n.includes('accesor')||n.includes('carg')||n.includes('auricular')||n.includes('apple watch')||n.includes('magnetic')) return 'Accesorios';
 return 'Varios';
}
function parseSunshineXlsx(wb){
 const out=[];
 const add=(p)=>{if(p && p.product && !/^sin stock$/i.test(p.product)) out.push(p)};
 const priceFromCell=(v)=>parseNumFromCatalog(v);
 for(const sn of wb.SheetNames){
   if(sn==='WpsReserved_CellImgList') continue;
   const ws=wb.Sheets[sn], rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:''});
   const general=sheetGeneral(sn);
   const lname=sn.toLowerCase();

   if(sn==='主'){
     let currentGeneral='Varios';
     for(let r=0;r<rows.length;r++){
       const row=rows[r]||[], next=rows[r+1]||[];
       const first=String(row[0]||'').trim();
       if(first){
         const f=first.toLowerCase();
         if(f.includes('templado')) currentGeneral='Vidrios';
         else if(f.includes('funda')) currentGeneral='Fundas';
         else if(f.includes('accesor')||f.includes('carg')||f.includes('auricular')||f.includes('memor')) currentGeneral='Accesorios';
         else if(f.includes('varios')||f.includes('soporte')) currentGeneral='Varios';
       }
       let paired=false;
       for(let c=1;c<row.length;c++){
         const product=String(row[c]||'').trim();
         const price=next[c];
         if(product && !/^(precio|modelo|marca|disponibilidad|color|pedido|stock)$/i.test(product) && (price!==''&&price!==null&&price!==undefined)){
           const usd=priceFromCell(price);
           if(usd && !/sin stock|consulta|precio/i.test(String(price))) { add(makeImported(product,currentGeneral,'', '', 'Media',usd)); paired=true; }
         }
       }
       if(paired) r++;
     }
     continue;
   }

   if(sn==='FUNDA SILICONA'){
     const rate=priceFromCell(rows[0]?.[0]);
     for(let r=1;r<rows.length;r++){ const row=rows[r]||[]; if(row[1]) add(makeImported([row[0],row[1],row[2]].filter(Boolean).join(' '),'Fundas','Silicona',String(row[0]||''),'Media',rate)); }
     continue;
   }
   if(sn==='Funda especial'){
     for(let r=1;r<rows.length;r++){const row=rows[r]||[]; if(row[1]) add(makeImported([row[1],row[2],row[3]].filter(Boolean).join(' '),'Fundas','Especial','', 'Media',row[4]));}
     continue;
   }
   if(sn==='FUNDA MAGSAFE'){
     for(let r=1;r<rows.length;r++){const row=rows[r]||[]; if(row[2]) add(makeImported([row[1],row[2],row[3]].filter(Boolean).join(' '),'Fundas','MagSafe','', 'Media',row[5],row[4]));}
     continue;
   }
   if(sn==='ANTIESPIA'){
     for(let r=2;r<rows.length;r++){const row=rows[r]||[]; if(row[1]) add(makeImported([row[0],row[1]].filter(Boolean).join(' '),'Vidrios','Antiespia',String(row[0]||''),'Media',row[3],row[2]));}
     continue;
   }
   if(sn==='CURVO Y UV'){
     for(let r=3;r<rows.length;r++){const row=rows[r]||[]; if(row[2]) add(makeImported([row[0],row[1],row[2]].filter(Boolean).join(' '),'Vidrios','Curvo / UV',String(row[1]||''),'Media',row[3],row[4]));}
     continue;
   }
   if(sn==='TABLET TEMPLADO'){
     const rate=priceFromCell(rows[0]?.[0]);
     for(let r=3;r<rows.length;r++){const row=rows[r]||[]; if(row[2]) add(makeImported([row[0],row[1],row[2],row[3]].filter(Boolean).join(' '),'Vidrios','Tablet',String(row[1]||''),'Media',rate,row[5]));}
     continue;
   }
   if(sn==='FUNDA PARA IPAD'){
     for(let r=2;r<rows.length;r++){const row=rows[r]||[]; if(row[1]) add(makeImported([row[0],row[1]].filter(Boolean).join(' '),'Fundas','iPad',String(row[0]||''),'Media',row[row.length-1]));}
     continue;
   }
   if(sn==='APPLE WATCH'){
     let model='';
     for(let r=1;r<rows.length;r++){const row=rows[r]||[]; if(row[0]) model=String(row[0]); if(row[1]) add(makeImported([model,row[1]].filter(Boolean).join(' '),'Accesorios','Apple Watch','Apple','Media',row[2]));}
     continue;
   }
   if(sn==='9D' || sn==='2D'){
     const rate=priceFromCell(rows[0]?.[2]);
     for(let r=3;r<rows.length;r++){const row=rows[r]||[]; if(row[1]) add(makeImported([row[0],row[1]].filter(Boolean).join(' '),'Vidrios',sn,String(row[0]||''),'Media',rate,row[2]));}
     continue;
   }
   if(sn==='TEMPLADO HIGH ALUMINIUM'){
     let rate=priceFromCell(rows[1]?.[1]) || priceFromCell(rows[1]?.[6]);
     for(let r=3;r<rows.length;r++){const row=rows[r]||[]; 
       if(row[1]) add(makeImported(row[1],'Vidrios','High Aluminium',String(row[0]||''),'Media',rate,row[2]));
       if(row[5]) add(makeImported(row[5],'Vidrios','High Aluminium','Samsung','Media',rate,row[2]));
       if(row[6]) add(makeImported(row[6],'Vidrios','High Aluminium','Motorola','Media',rate,row[2]));
     }
     continue;
   }

   // Fallback for other Excel sheets: use rows as records and extract any explicit USD/price value.
   const objs=XLSX.utils.sheet_to_json(ws,{defval:''});
   if(objs.length){
     const mapped=mapCatalogRows(objs);
     mapped.forEach(x=>{ if(x.product) add(x); });
   }
 }
 // Remove exact duplicates produced by merged/duplicated catalog sections.
 const seen=new Set(), clean=[];
 for(const p of out){
   const key=[p.product,p.priceUSD,p.general,p.classification,p.brand].join('|').toLowerCase();
   if(!seen.has(key)){seen.add(key);clean.push(p);}
 }
 return clean;
}

async function bufferToDataURL(buf, ext){
  if(!buf) return '';
  const bytes = buf instanceof ArrayBuffer ? new Uint8Array(buf) : new Uint8Array(buf.buffer || buf);
  let binary=''; const chunk=0x8000;
  for(let i=0;i<bytes.length;i+=chunk) binary += String.fromCharCode(...bytes.subarray(i, Math.min(i+chunk, bytes.length)));
  const mime = ext==='png'?'image/png':ext==='gif'?'image/gif':ext==='webp'?'image/webp':'image/jpeg';
  return `data:${mime};base64,${btoa(binary)}`;
}
function normPhotoText(v){return String(v??'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,' ').trim();}
async function buildExcelPhotoRows(buf){
  const wb=new ExcelJS.Workbook(); await wb.xlsx.load(buf);
  const result={};
  for(const ws of wb.worksheets){
    const photos=[];
    for(const pic of ws.getImages()){
      try{
        const img=wb.getImage(pic.imageId); const d=pic.range?.tl || pic.range?.br;
        if(!d) continue;
        const row=Math.max(0, Math.round(d.nativeRow??d.row??0));
        const col=Math.max(0, Math.round(d.nativeCol??d.col??0));
        const url=await bufferToDataURL(img.buffer, img.extension);
        if(url) photos.push({row,col,url});
      }catch(err){ console.warn('No se pudo extraer una imagen',err); }
    }
    result[ws.name]=photos;
  }
  return result;
}
function attachExcelPhotos(products, wb, photoRows){
  if(!products.length) return products;
  for(const sn of Object.keys(photoRows||{})){
    const ws=wb.Sheets[sn]; if(!ws) continue;
    const rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:''});
    const candidates=(photoRows[sn]||[]).map(ph=>{
      const r=ph.row; const row=rows[r]||[];
      const text=normPhotoText(row.join(' '));
      return {...ph,text,row:r};
    });
    if(!candidates.length) continue;
    for(const p of products.filter(x=>!x.photo)){
      const pt=normPhotoText(p.product); if(!pt) continue;
      const tokens=pt.split(' ').filter(t=>t.length>=2);
      let best=null, bestScore=0;
      for(const c of candidates){
        if(!c.text) continue;
        let score=0; for(const t of tokens) if(c.text.includes(t)) score++;
        if(c.text.includes(pt)) score+=4;
        if(score>bestScore){bestScore=score;best=c;}
      }
      if(best && bestScore>=Math.max(1,Math.min(3,tokens.length))) p.photo=best.url;
    }
  }
  return products;
}
async function parseSunshineXlsxWithImages(buf, wb){
  const products=parseSunshineXlsx(wb);
  try{
    const photoRows=await buildExcelPhotoRows(buf);
    attachExcelPhotos(products, wb, photoRows);
  }catch(err){ console.warn('No se pudieron leer las fotos del Excel',err); }
  return products;
}
function parseCSVProducts(text){const lines=text.split(/\r?\n/).filter(x=>x.trim()); if(!lines.length)return[]; const sep=lines[0].includes(';')?';':','; const headers=lines[0].split(sep).map(x=>x.replace(/^"|"$/g,'')); return mapCatalogRows(lines.slice(1).map(line=>{const vals=line.split(sep).map(x=>x.replace(/^"|"$/g,'')); const o={}; headers.forEach((h,i)=>o[h]=vals[i]||''); return o;}));}
async function parsePDFCatalog(file){
 const buf=await file.arrayBuffer(); const pdf=await pdfjsLib.getDocument({data:buf}).promise; let text=''; for(let i=1;i<=pdf.numPages;i++){const page=await pdf.getPage(i); const c=await page.getTextContent(); text+='\n'+c.items.map(x=>x.str).join(' ');}
 const provider=detectProviderFromText(text); const lines=text.split(/\n+/).map(x=>x.trim()).filter(Boolean); const out=[]; lines.forEach(line=>{const price=line.match(/(?:\$\s*)?([0-9]{2,}(?:[.,][0-9]{2,3})?)/); if(price){const product=line.replace(price[0],'').replace(/\s{2,}/g,' ').trim(); if(product.length>2)out.push({product,price:price[1].replace('.','').replace(',','.'),general:'Varios',classification:'',brand:'',quality:'Media',dispatch:'',currentAccount:'No',discount:'No',percent:'0',obs:''});}}); return {products:out.slice(0,1000),provider};
}

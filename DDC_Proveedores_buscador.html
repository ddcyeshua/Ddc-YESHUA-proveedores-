<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Proveedores | Sistema interno — Catálogos automáticos</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--text:#182230;--muted:#667085;--line:#e5e7eb;--accent:#2563eb;--green:#16a34a;--yellow:#ca8a04;--red:#dc2626}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
header{background:#111827;color:#fff;padding:16px 28px;display:flex;justify-content:space-between;align-items:center;gap:16px}
header h1{margin:0;font-size:22px}.brand{display:flex;align-items:center;gap:14px}.brand img{width:88px;height:58px;object-fit:contain;background:#fff;border-radius:10px;padding:4px}.brandtext{display:flex;flex-direction:column;gap:3px}header span{color:#cbd5e1;font-size:13px}
main{max-width:1250px;margin:0 auto;padding:28px}
.toolbar{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:22px}
.search{flex:1;min-width:260px;padding:14px 16px;border:1px solid var(--line);border-radius:12px;font-size:16px;background:#fff}
button{border:0;border-radius:10px;padding:12px 16px;font-weight:700;cursor:pointer}
.primary{background:var(--accent);color:white}.secondary{background:#fff;border:1px solid var(--line);color:var(--text)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px}
.stat{background:var(--card);padding:18px;border:1px solid var(--line);border-radius:14px}.stat b{display:block;font-size:25px}.stat small{color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.table-wrap{overflow:auto;-webkit-overflow-scrolling:touch}table{width:100%;min-width:1200px;border-collapse:collapse}th,td{padding:13px 14px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}th{font-size:12px;text-transform:uppercase;color:var(--muted);background:#f8fafc}td{font-size:14px}
.badge{display:inline-block;padding:5px 9px;border-radius:999px;font-size:12px;font-weight:800}.alta{background:#dcfce7;color:#166534}.media{background:#fef9c3;color:#854d0e}.baja{background:#fee2e2;color:#991b1b}
.modal{display:none;position:fixed;inset:0;background:rgba(15,23,42,.5);align-items:center;justify-content:center;padding:18px;z-index:10}.modal.open{display:flex}
.modalbox{background:#fff;border-radius:18px;width:min(760px,100%);max-height:92vh;overflow:auto;padding:24px}.modalhead{display:flex;justify-content:space-between;align-items:center}.modalhead h2{margin:0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{display:flex;flex-direction:column;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:13px;font-weight:700}.field input,.field select,.field textarea{padding:11px;border:1px solid var(--line);border-radius:10px;font:inherit}.field textarea{min-height:80px;resize:vertical}
.preview{width:100%;max-height:180px;object-fit:contain;border:1px dashed var(--line);border-radius:10px;margin-top:5px;display:none}.actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}
.provider-list{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}.provider{background:#fff;border:1px solid var(--line);padding:9px 12px;border-radius:10px;cursor:pointer}.provider.active{border-color:var(--accent);color:var(--accent);font-weight:800}
.empty{text-align:center;padding:45px;color:var(--muted)}
@media(max-width:800px){.stats{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.field.full{grid-column:auto}}
</style>

<style id="ddc-two-products-row">
/* Solo cambia la distribución visual de los productos */
.product-grid, .products-grid, .products, .catalog-grid, .product-list {
  display: grid !important;
  grid-template-columns: repeat(2, minmax(0, 1fr)) !important;
  gap: 18px !important;
}
@media (max-width: 700px) {
  .product-grid, .products-grid, .products, .catalog-grid, .product-list {
    grid-template-columns: 1fr !important;
  }
}
</style>

</head>

const KEY='proveedores_demo_v1';
let data=JSON.parse(localStorage.getItem(KEY)||'null')||{providers:[],products:[],providerRates:{}};
data.providerRates=data.providerRates||{};
let photoData='';
function providerRate(name){ return data.providerRates[name]||''; }
function setProviderRate(name,rate){ if(rate) data.providerRates[name]=String(rate); else delete data.providerRates[name]; data.products.forEach(p=>{if(p.provider===name){p.dollarRate=String(rate||'');p.priceARS=arsFromUsd(p.priceUSD,rate)}}); }
function save(){localStorage.setItem(KEY,JSON.stringify(data));render()}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function money(v){return v?('$'+Number(v).toLocaleString('es-AR')):'—'}
function arsFromUsd(usd,rate){const a=Number(usd)||0,r=Number(rate)||0;return a&&r?a*r:0}
function priceLabel(p){return p.priceUSD?`USD ${Number(p.priceUSD).toLocaleString('es-AR',{minimumFractionDigits:2,maximumFractionDigits:2})}`:money(p.price)}
function quality(q){return q?`<span class="badge ${q.toLowerCase()}">${esc(q)}</span>`:'—'}
function render(){
 const q=document.getElementById('search').value.trim().toLowerCase();
 const products=q ? data.products.filter(p=>[p.provider,p.product,p.brand,p.general,p.classification].join(' ').toLowerCase().includes(q)) : [];
 document.getElementById('nProviders').textContent=data.providers.length;
 document.getElementById('nProducts').textContent=data.products.length;
 document.getElementById('nBrands').textContent=new Set(data.products.map(p=>p.brand).filter(Boolean)).size;
 document.getElementById('nDiscount').textContent=data.products.filter(p=>p.discount==='Sí').length;
 document.getElementById('providers').innerHTML=data.providers.map((p,i)=>`<div style="display:flex;gap:5px;align-items:center">
 <button class="provider" onclick="filterProvider('${esc(p)}')">${esc(p)} ${providerRate(p)?`· 💵 ${money(providerRate(p))}`:''}</button>
 <button class="secondary" title="Editar proveedor" onclick="editProvider(${i})">✏️</button>
 <button class="secondary" title="Eliminar proveedor" onclick="deleteProvider(${i})">🗑️</button>
 </div>`).join('');
 document.getElementById('results').innerHTML=products.length?products.map(p=>`<tr>
 <td><b>${esc(p.provider)}</b></td><td>${esc(p.product)}</td><td>${esc(p.general)}</td><td>${esc(p.classification)}</td><td>${esc(p.brand)||'—'}</td>
 <td>${quality(p.quality)}</td><td><b>${p.priceUSD?'USD '+Number(p.priceUSD).toLocaleString('es-AR',{minimumFractionDigits:2,maximumFractionDigits:2}):'—'}</b></td><td>${p.priceUSD&&providerRate(p.provider)?money(providerRate(p.provider)):'—'}</td><td>${p.priceUSD&&providerRate(p.provider)?money(arsFromUsd(p.priceUSD,providerRate(p.provider))):'—'}</td><td>${esc(p.dispatch)||'—'}</td><td>${p.currentAccount||'—'}</td>
 <td>${p.discount==='Sí'?esc(p.discount)+' · '+esc(p.percent||'0')+'%':'No'}</td><td>${p.photo?`<button class="secondary" onclick="viewPhoto(${data.products.indexOf(p)})">📷 Ver foto</button>`:'—'}</td>
 <td><button class="secondary" onclick="editProduct(${data.products.indexOf(p)})">✏️</button>
 <button class="secondary" onclick="deleteProduct(${data.products.indexOf(p)})">🗑️</button></td></tr>`).join(''):`<tr><td colspan="14" class="empty">No hay productos que coincidan con la búsqueda.</td></tr>`;
}
function filterProvider(name){document.getElementById('search').value=name;render()}
function openProvider(){
 document.getElementById('modalTitle').textContent='Nuevo proveedor';
 document.getElementById('form').innerHTML=`<div class="grid">
 <div class="field full"><label>Nombre del proveedor</label><input id="pn"></div>
 <div class="field"><label>💵 Tasa dólar del proveedor</label><input id="prate" type="number" min="0" step="0.01" placeholder="Ej. 1500"></div>
 <div class="field"><label>Cuenta corriente</label><select id="pc"><option>Sí</option><option>No</option></select></div>
 <div class="field"><label>Aplica descuento</label><select id="pd"><option>Sí</option><option>No</option></select></div>
 <div class="field"><label>% descuento</label><input id="pp" type="number" min="0" max="100" step="0.1"></div>
 <div class="field"><label>Tiempo de despacho</label><input id="pt" placeholder="Ej. 24-48 h"></div>
 <div class="field full"><label>Observaciones generales</label><textarea id="po"></textarea></div></div>
 <div class="actions"><button class="secondary" onclick="closeModal()">Cancelar</button><button class="primary" onclick="addProvider()">Guardar proveedor</button></div>`;
 document.getElementById('modal').classList.add('open');
}
function addProvider(){let n=document.getElementById('pn').value.trim();if(!n)return alert('Ingresá el nombre del proveedor.');if(!data.providers.includes(n))data.providers.push(n);setProviderRate(n,document.getElementById('prate').value);save();closeModal()}

function editProvider(i){
 const p=data.providers[i];
 document.getElementById('modalTitle').textContent='Editar proveedor';
 document.getElementById('form').innerHTML=`<div class="grid">
 <div class="field full"><label>Nombre del proveedor</label><input id="pn" value="${esc(p)}"></div>
 <div class="field"><label>💵 Tasa dólar del proveedor</label><input id="prate" type="number" min="0" step="0.01" value="${esc(providerRate(p))}" placeholder="Ej. 1500"></div>
 </div>
 <div class="actions"><button class="secondary" onclick="closeModal()">Cancelar</button><button class="primary" onclick="saveProvider(${i})">Guardar cambios</button></div>`;
 document.getElementById('modal').classList.add('open');
}
function saveProvider(i){
 const n=document.getElementById('pn').value.trim();
 if(!n)return alert('Ingresá el nombre del proveedor.');
 const old=data.providers[i];
 data.providers[i]=n;
 const rate=document.getElementById('prate').value;
 if(old!==n && data.providerRates[old]){data.providerRates[n]=data.providerRates[old];delete data.providerRates[old]}
 setProviderRate(n,rate);
 data.products.forEach(p=>{if(p.provider===old)p.provider=n});
 data.products.filter(p=>p.provider===n).forEach(p=>{p.dollarRate=rate;p.priceARS=arsFromUsd(p.priceUSD,rate)});
 save();closeModal();
}
function deleteProvider(i){
 const n=data.providers[i];
 if(!confirm(`¿Eliminar el proveedor "${n}"? También se eliminarán sus productos.`))return;
 data.providers.splice(i,1);
 delete data.providerRates[n];
 data.products=data.products.filter(p=>p.provider!==n);
 save();
}
function editProduct(i){
 const p=data.products[i];
 photoData=p.photo||'';
 document.getElementById('modalTitle').textContent='Editar producto';
 document.getElementById('form').innerHTML=`<div class="grid">
 <div class="field"><label>Proveedor</label><select id="fprovider">${data.providers.map(x=>`<option ${x===p.provider?'selected':''}>${esc(x)}</option>`).join('')}</select></div>
 <div class="field"><label>Producto</label><input id="fproduct" value="${esc(p.product)}"></div>
 <div class="field"><label>General</label><select id="fgeneral">${['Vidrios','Fundas','Accesorios','Varios'].map(x=>`<option ${x===p.general?'selected':''}>${x}</option>`).join('')}</select></div>
 <div class="field"><label>Clasificación</label><input id="fclass" value="${esc(p.classification)}"></div>
 <div class="field"><label>Marca</label><input id="fbrand" value="${esc(p.brand)}"></div>
 <div class="field"><label>Calidad</label><select id="fquality">${['Alta','Media','Baja'].map(x=>`<option ${x===p.quality?'selected':''}>${x}</option>`).join('')}</select></div>
 <div class="field"><label>Precio en USD</label><input id="fpriceusd" type="number" min="0" step="0.01" value="${esc(p.priceUSD||'')}" oninput="updateProductConversion()"></div>
 <div class="field"><label>Tasa dólar</label><input id="frate" type="number" min="0" step="0.01" value="${esc(p.dollarRate||'')}" oninput="updateProductConversion()"></div>
 <div class="field"><label>Precio en pesos</label><input id="fpricears" readonly value="${p.priceARS?money(p.priceARS):''}" placeholder="Se calcula automáticamente"></div>
 <div class="field"><label>Tiempo de despacho</label><input id="fdispatch" value="${esc(p.dispatch)}"></div>
 <div class="field"><label>Cuenta corriente</label><select id="faccount"><option ${p.currentAccount==='Sí'?'selected':''}>Sí</option><option ${p.currentAccount==='No'?'selected':''}>No</option></select></div>
 <div class="field"><label>Aplica descuento</label><select id="fdiscount"><option ${p.discount==='No'?'selected':''}>No</option><option ${p.discount==='Sí'?'selected':''}>Sí</option></select></div>
 <div class="field"><label>% de descuento</label><input id="fpercent" type="number" min="0" max="100" step="0.1" value="${esc(p.percent||0)}"></div>
 <div class="field"><label>Foto del producto</label><input id="fphoto" type="file" accept="image/*" onchange="loadPhoto(event)">
 ${p.photo?`<img id="preview" class="preview" style="display:block" src="${p.photo}">`:`<img id="preview" class="preview">`}</div>
 <div class="field full"><label>Observaciones</label><textarea id="fobs">${esc(p.obs)}</textarea></div></div>
 <div class="actions"><button class="secondary" onclick="closeModal()">Cancelar</button><button class="primary" onclick="saveProduct(${i})">Guardar cambios</button></div>`;
 document.getElementById('modal').classList.add('open');
}
function saveProduct(i){
 const p=data.products[i];
 p.provider=document.getElementById('fprovider').value;
 p.product=document.getElementById('fproduct').value.trim();
 p.general=document.getElementById('fgeneral').value;
 p.classification=document.getElementById('fclass').value.trim();
 p.brand=document.getElementById('fbrand').value.trim();
 p.quality=document.getElementById('fquality').value;
 p.price='';
 p.priceUSD=document.getElementById('fpriceusd').value;
 p.dollarRate=document.getElementById('frate').value;
 p.priceARS=arsFromUsd(p.priceUSD,p.dollarRate);
 p.dispatch=document.getElementById('fdispatch').value.trim();
 p.currentAccount=document.getElementById('faccount').value;
 p.discount=document.getElementById('fdiscount').value;
 p.percent=document.getElementById('fpercent').value;
 p.photo=photoData||'';
 p.obs=document.getElementById('fobs').value.trim();
 if(!p.product)return alert('Ingresá el nombre del producto.');
 save();closeModal();
}
function deleteProduct(i){
 const p=data.products[i];
 if(!confirm(`¿Eliminar "${p.product}" de ${p.provider}?`))return;
 data.products.splice(i,1);
 save();
}
function openProduct(){
 if(!data.providers.length){alert('Primero agregá un proveedor.');return}
 photoData='';
 document.getElementById('modalTitle').textContent='Agregar producto';
 document.getElementById('form').innerHTML=`<div class="grid">
 <div class="field"><label>Proveedor</label><select id="fprovider">${data.providers.map(p=>`<option>${esc(p)}</option>`).join('')}</select></div>
 <div class="field"><label>Producto</label><input id="fproduct" placeholder="Ej. Vidrio Samsung A15"></div>
 <div class="field"><label>General</label><select id="fgeneral"><option>Vidrios</option><option>Fundas</option><option>Accesorios</option><option>Varios</option></select></div>
 <div class="field"><label>Clasificación</label><input id="fclass" placeholder="Ej. Templado, silicona, cargador..."></div>
 <div class="field"><label>Marca</label><input id="fbrand"></div>
 <div class="field"><label>Calidad</label><select id="fquality"><option>Alta</option><option>Media</option><option>Baja</option></select></div>
 <div class="field"><label>Precio en USD</label><input id="fpriceusd" type="number" min="0" step="0.01" oninput="updateProductConversion()"></div>
 <div class="field"><label>Tasa dólar</label><input id="frate" type="number" min="0" step="0.01" placeholder="Ej. 1500" oninput="updateProductConversion()"></div>
 <div class="field"><label>Precio en pesos</label><input id="fpricears" readonly placeholder="Se calcula automáticamente"></div>
 <div class="field"><label>Tiempo de despacho</label><input id="fdispatch" placeholder="Ej. 24-48 h"></div>
 <div class="field"><label>Cuenta corriente</label><select id="faccount"><option>Sí</option><option>No</option></select></div>
 <div class="field"><label>Aplica descuento</label><select id="fdiscount"><option>No</option><option>Sí</option></select></div>
 <div class="field"><label>% de descuento</label><input id="fpercent" type="number" min="0" max="100" step="0.1" value="0"></div>
 <div class="field"><label>Foto del producto</label><input id="fphoto" type="file" accept="image/*" onchange="loadPhoto(event)"><img id="preview" class="preview"></div>
 <div class="field full"><label>Observaciones</label><textarea id="fobs"></textarea></div></div>
 <div class="actions"><button class="secondary" onclick="closeModal()">Cancelar</button><button class="primary" onclick="addProduct()">Guardar producto</button></div>`;
 document.getElementById('modal').classList.add('open');
}
function loadPhoto(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{photoData=r.result;let im=document.getElementById('preview');im.src=photoData;im.style.display='block'};r.readAsDataURL(f)}
function updateProductConversion(){const usd=Number(document.getElementById('fpriceusd')?.value)||0;const rate=Number(document.getElementById('frate')?.value)||0;const el=document.getElementById('fpricears');if(el)el.value=usd&&rate?('$ '+(usd*rate).toLocaleString('es-AR',{minimumFractionDigits:2,maximumFractionDigits:2})):'$ 0';}
function addProduct(){
 const p={provider:document.getElementById('fprovider').value,product:document.getElementById('fproduct').value.trim(),general:document.getElementById('fgeneral').value,classification:document.getElementById('fclass').value.trim(),brand:document.getElementById('fbrand').value.trim(),quality:document.getElementById('fquality').value,price:'',priceUSD:document.getElementById('fpriceusd').value, dollarRate:document.getElementById('frate').value, priceARS:arsFromUsd(document.getElementById('fpriceusd').value,document.getElementById('frate').value),dispatch:document.getElementById('fdispatch').value.trim(),currentAccount:document.getElementById('faccount').value,discount:document.getElementById('fdiscount').value,percent:document.getElementById('fpercent').value,photo:photoData,obs:document.getElementById('fobs').value.trim()};
 if(!p.product)return alert('Ingresá el nombre del producto.');
 data.products.push(p);save();closeModal();
}


function productFormRow(i,p={}){
 return `<tr data-row="${i}">
 <td><input class="bulk-product" value="${esc(p.product||'')}" placeholder="Producto"></td>
 <td><select class="bulk-general"><option ${p.general==='Vidrios'?'selected':''}>Vidrios</option><option ${p.general==='Fundas'?'selected':''}>Fundas</option><option ${p.general==='Accesorios'?'selected':''}>Accesorios</option><option ${p.general==='Varios'?'selected':''}>Varios</option></select></td>
 <td><input class="bulk-class" value="${esc(p.classification||'')}" placeholder="Clasificación"></td>
 <td><input class="bulk-brand" value="${esc(p.brand||'')}" placeholder="Marca"></td>
 <td><select class="bulk-quality"><option ${p.quality==='Alta'?'selected':''}>Alta</option><option ${p.quality==='Media'?'selected':''}>Media</option><option ${p.quality==='Baja'?'selected':''}>Baja</option></select></td>
 <td><input class="bulk-usd" type="number" min="0" step="0.01" value="${esc(p.priceUSD||'')}" placeholder="USD"></td>
 <td><input class="bulk-rate" type="number" min="0" step="0.01" value="${esc(p.dollarRate||'')}" placeholder="Tasa"></td>
 <td><input class="bulk-ars" readonly value="${p.priceARS?money(p.priceARS):''}" placeholder="$"></td>
 <td><input class="bulk-dispatch" value="${esc(p.dispatch||'')}" placeholder="24-48 h"></td>
 <td><select class="bulk-account"><option ${p.currentAccount==='Sí'?'selected':''}>Sí</option><option ${p.currentAccount==='No'?'selected':''}>No</option></select></td>
 <td><select class="bulk-discount"><option ${p.discount==='No'?'selected':''}>No</option><option ${p.discount==='Sí'?'selected':''}>Sí</option></select></td>
 <td><input class="bulk-percent" type="number" min="0" max="100" step="0.1" value="${esc(p.percent||0)}"></td>
 <td><button class="secondary" onclick="this.closest('tr').remove()">🗑️</button></td></tr>`;
}
function updateBulkConversions(){document.querySelectorAll('#bulkRows tr').forEach(r=>{const usd=Number(r.querySelector('.bulk-usd')?.value)||0,rate=Number(r.querySelector('.bulk-rate')?.value)||0,ars=r.querySelector('.bulk-ars');if(ars)ars.value=usd&&rate?('$ '+(usd*rate).toLocaleString('es-AR',{minimumFractionDigits:2,maximumFractionDigits:2})):'$ 0';});}
function openBulkProducts(){
 if(!data.providers.length){alert('Primero agregá un proveedor.');return}
 document.getElementById('modalTitle').textContent='Cargar varios productos';
 document.getElementById('form').innerHTML=`<div class="field"><label>Proveedor</label><select id="bulkProvider">${data.providers.map(x=>`<option>${esc(x)}</option>`).join('')}</select></div>
 <div style="overflow:auto;margin-top:12px"><table style="min-width:1100px"><thead><tr><th>Producto</th><th>General</th><th>Clasificación</th><th>Marca</th><th>Calidad</th><th>USD</th><th>Tasa</th><th>Pesos</th><th>Despacho</th><th>Cuenta</th><th>Descuento</th><th>%</th><th></th></tr></thead><tbody id="bulkRows">${productFormRow(0)}${productFormRow(1)}${productFormRow(2)}</tbody></table></div>
 <div class="actions"><button class="secondary" onclick="addBulkRow()">＋ Agregar fila</button><button class="secondary" onclick="closeModal()">Cancelar</button><button class="primary" onclick="saveBulkProducts()">💾 Guardar todos</button></div>`;
 document.getElementById('modal').classList.add('open');
 document.getElementById('bulkRows').addEventListener('input',updateBulkConversions);
}
function addBulkRow(){const b=document.getElementById('bulkRows'); b.insertAdjacentHTML('beforeend',productFormRow(b.children.length));}
function saveBulkProducts(){
 const provider=document.getElementById('bulkProvider').value, rows=[...document.querySelectorAll('#bulkRows tr')]; let added=0;
 rows.forEach(r=>{const product=r.querySelector('.bulk-product').value.trim(); if(!product)return; data.products.push({provider,product,general:r.querySelector('.bulk-general').value,classification:r.querySelector('.bulk-class').value.trim(),brand:r.querySelector('.bulk-brand').value.trim(),quality:r.querySelector('.bulk-quality').value,price:'',priceUSD:r.querySelector('.bulk-usd').value,dollarRate:r.querySelector('.bulk-rate').value,priceARS:arsFromUsd(r.querySelector('.bulk-usd').value,r.querySelector('.bulk-rate').value),dispatch:r.querySelector('.bulk-dispatch').value.trim(),currentAccount:r.querySelector('.bulk-account').value,discount:r.querySelector('.bulk-discount').value,percent:r.querySelector('.bulk-percent').value,photo:'',obs:''}); added++;}); if(!added){alert('Agregá al menos un producto.');return} save(); closeModal(); alert(`Se cargaron ${added} productos.`);
}
function openCatalogImport(){
 if(!data.providers.length){alert('Primero agregá un proveedor.');return}
 document.getElementById('modalTitle').textContent='Subir catálogo completo';
 document.getElementById('form').innerHTML=`<div class="field"><label>Proveedor</label><select id="catProvider">${data.providers.map(x=>`<option>${esc(x)}</option>`).join('')}</select></div>
 <div id="providerDetection" style="margin:10px 0;padding:10px;border-radius:10px;background:#f3f4f6;display:none"></div>
 <div class="field full"><label>📚 Catálogo (PDF, Excel, Word, CSV, TXT, imágenes)</label><input id="catalogFile" type="file" accept=".pdf,.xlsx,.xls,.csv,.docx,.txt,.json,.jpg,.jpeg,.png,.webp" multiple onchange="parseCatalogFiles(event)"><small style="color:var(--muted)">Podés seleccionar uno o varios archivos. Los catálogos con imágenes se procesan con OCR.</small></div>
 <div id="catalogStatus" style="margin:12px 0;font-weight:600">Elegí un archivo para comenzar.</div><div id="catalogPreview"></div>
 <div class="actions"><button class="secondary" onclick="closeModal()">Cancelar</button><button id="saveCatalogBtn" class="primary" style="display:none" onclick="saveImportedCatalog()">💾 Guardar productos detectados</button></div>`;
 document.getElementById('modal').classList.add('open');
}
let importedCatalog=[];
function detectProviderFromText(text){
 const t=String(text||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
 let best=null;
 data.providers.forEach((name,idx)=>{
   const n=String(name).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
   if(n.length>=3 && t.includes(n)) best={name,idx};
 });
 return best;
}
function showProviderDetection(match,source){
 const box=document.getElementById('providerDetection'); if(!box)return;
 if(match){
   document.getElementById('catProvider').value=match.name;
   box.style.display='block';
   box.innerHTML=`🔎 <b>Proveedor detectado:</b> ${esc(match.name)}<br><small>Lo encontré en ${source}. Verificá que sea correcto antes de guardar.</small>`;
 }else{
   box.style.display='block';
   box.innerHTML='⚠️ <b>No pude identificar automáticamente el proveedor.</b> Elegilo manualmente en la lista.';
 }
}
async function parseCatalogFiles(e){
 const files=[...e.target.files]; if(!files.length)return;
 const status=document.getElementById('catalogStatus'); status.textContent=`Leyendo ${files.length} archivo(s)…`; importedCatalog=[];
 let providerMatch=null;
 try{
  for(const file of files){
   providerMatch=providerMatch||detectProviderFromText(file.name);
   const ext=(file.name.split('.').pop()||'').toLowerCase();
   if(['csv'].includes(ext)){const text=await file.text(); providerMatch=providerMatch||detectProviderFromText(text.slice(0,15000)); importedCatalog.push(...parseCSVProducts(text));}
   else if(['xlsx','xls'].includes(ext)){const buf=await file.arrayBuffer(); const wb=XLSX.read(buf,{type:'array'}); const raw=JSON.stringify(wb.SheetNames)+' '+JSON.stringify(wb.Sheets['主']?XLSX.utils.sheet_to_json(wb.Sheets['主'],{header:1,defval:''}).slice(0,8):[]); providerMatch=providerMatch||detectProviderFromText(raw); const supplierText=(wb.Sheets['主']?XLSX.utils.sheet_to_json(wb.Sheets['主'],{header:1,defval:''}).flat().filter(Boolean).join(' '):''); if(!providerMatch){const supplier=(supplierText.match(/SUNSHINE\s*CELL/i)||[])[0]; if(supplier){providerMatch={name:supplier.toUpperCase(),idx:-1};}} importedCatalog.push(...await parseSunshineXlsxWithImages(buf, wb));}
   else if(ext==='pdf'){const result=await parsePDFCatalog(file); importedCatalog.push(...result.products); providerMatch=providerMatch||result.provider;}
   else if(ext==='docx'){const buf=await file.arrayBuffer(); const r=await mammoth.extractRawText({arrayBuffer:buf}); providerMatch=providerMatch||detectProviderFromText(r.value.slice(0,15000)); importedCatalog.push(...parseLooseText(r.value));}
   else if(ext==='txt'){const text=await file.text(); providerMatch=providerMatch||detectProviderFromText(text.slice(0,15000)); importedCatalog.push(...parseLooseText(text));}
   else if(ext==='json'){const text=await file.text(); const obj=JSON.parse(text); const rows=Array.isArray(obj)?obj:(obj.products||obj.productos||[]); providerMatch=providerMatch||detectProviderFromText(JSON.stringify(obj).slice(0,15000)); importedCatalog.push(...mapCatalogRows(rows));}
   else if(['jpg','jpeg','png','webp'].includes(ext)){const r=await OCRImage(file); providerMatch=providerMatch||detectProviderFromText(r.text.slice(0,15000)); importedCatalog.push(...parseLooseText(r.text));}
  }
  showProviderDetection(providerMatch, providerMatch?'el nombre o contenido del catálogo':'');
  const selected=document.getElementById('catProvider');
  if(selected && !providerMatch && selected.value) { importedCatalog.forEach(x=>x.dollarRate=providerRate(selected.value)); }
  renderCatalogPreview();
 }catch(err){status.textContent='No pude leer el catálogo: '+err.message; console.error(err);}
}
async function OCRImage(file){
 const status=document.getElementById('catalogStatus'); status.textContent=`Leyendo imagen con OCR: ${file.name}…`;
 const r=await Tesseract.recognize(file,'spa+eng',{logger:m=>{if(m.status==='recognizing text')status.textContent=`Leyendo imagen… ${Math.round((m.progress||0)*100)}%`;}});
 return {text:r.data.text||''};
}
function parseLooseText(text){
 const lines=String(text||'').split(/\r?\n/).map(x=>x.trim()).filter(Boolean); const out=[];
 lines.forEach(line=>{const price=line.match(/(?:USD|US\$|\$)\s*([0-9]+(?:[.,][0-9]+)?)/i); const m=line.match(/(?:USD|US\$)\s*([0-9]+(?:[.,][0-9]+)?)/i); if(price||m){const raw=(m?m[1]:price[1]).replace(/\./g,'').replace(',','.'); const product=line.replace(price?price[0]:'','').trim(); if(product.length>1) out.push({product,price:'',priceUSD:raw,general:'Varios',classification:'',brand:'',quality:'Media',dollarRate:'',priceARS:0,dispatch:'',currentAccount:'No',discount:'No',percent:'0',obs:''});}});
 return out;
}
function normKey(k){return String(k||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]/g,'')}
function mapCatalogRows(rows){return rows.map(r=>{const m={}; Object.keys(r).forEach(k=>m[normKey(k)]=r[k]); return {product:String(m.producto||m.nombre||m.descripcion||m.item||'').trim(),general:String(m.general||'Varios').trim(),classification:String(m.clasificacion||m.tipo||m.category||'').trim(),brand:String(m.marca||m.brand||'').trim(),quality:String(m.calidad||m.quality||'Media').trim(),price:'',priceUSD:String(m.usd||m.preciousd||m.preciousdolares||'').replace(/[^0-9.,]/g,'').replace(',','.'),dollarRate:String(m.tasa||m.tasadolar||m.tipodecambio||'').replace(/[^0-9.,]/g,'').replace(',','.'),priceARS:0,dispatch:String(m.despacho||m.tiempodedespacho||'').trim(),currentAccount:String(m.cuentacorriente||m.cuenta||'No').trim(),discount:String(m.descuento||'No').trim(),percent:String(m.porcentajedescuento||m.porcentaje||'0').replace('%','').trim(),obs:String(m.observaciones||m.obs||'').trim()};}).filter(x=>x.product)}

function parseNumFromCatalog(v){
 if(v===null||v===undefined||v==='') return '';
 if(typeof v==='number') return String(v);
 const s=String(v).trim();
 const m=s.match(/(?:USD|US\$|U\$D?|U\$|\$)\s*([0-9]+(?:[.,][0-9]+)?(?:\s*[-/]\s*[0-9]+(?:[.,][0-9]+)?)?)/i);
 if(m) return m[1].replace(/\s+/g,'').replace(/,/g,'.');
 const n=s.match(/([0-9]+(?:[.,][0-9]+)?)/);
 return n?n[1].replace(/,/g,'.'):'';
}
function makeImported(product,general,classification,brand,quality,usd,dispatch){
 const priceUSD=parseNumFromCatalog(usd);
 return {product:String(product||'').replace(/\s+/g,' ').trim(),general:general||'Varios',classification:classification||'',brand:brand||'',quality:quality||'Media',price:'',priceUSD,dollarRate:'',priceARS:0,dispatch:dispatch||'',currentAccount:'No',discount:'No',percent:'0',obs:''};
}
function sheetGeneral(name){
 const n=String(name||'').toLowerCase();
 if(n.includes('silicona')||n.includes('funda')) return 'Fundas';
 if(n.includes('templado')||n.includes('antiespia')||n.includes('9d')||n==='2d'||n.includes('curvo')||n.includes('uv')) return 'Vidrios';
 if(n.includes('accesor')||n.includes('carg')||n.includes('auricular')||n.includes('apple watch')||n.includes('magnetic')) return 'Accesorios';
 return 'Varios';
}
function parseSunshineXlsx(wb){
 const out=[];
 const add=(p)=>{if(p && p.product && !/^sin stock$/i.test(p.product)) out.push(p)};
 const priceFromCell=(v)=>parseNumFromCatalog(v);
 for(const sn of wb.SheetNames){
   if(sn==='WpsReserved_CellImgList') continue;
   const ws=wb.Sheets[sn], rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:''});
   const general=sheetGeneral(sn);
   const lname=sn.toLowerCase();

   if(sn==='主'){
     let currentGeneral='Varios';
     for(let r=0;r<rows.length;r++){
       const row=rows[r]||[], next=rows[r+1]||[];
       const first=String(row[0]||'').trim();
       if(first){
         const f=first.toLowerCase();
         if(f.includes('templado')) currentGeneral='Vidrios';
         else if(f.includes('funda')) currentGeneral='Fundas';
         else if(f.includes('accesor')||f.includes('carg')||f.includes('auricular')||f.includes('memor')) currentGeneral='Accesorios';
         else if(f.includes('varios')||f.includes('soporte')) currentGeneral='Varios';
       }
       let paired=false;
       for(let c=1;c<row.length;c++){
         const product=String(row[c]||'').trim();
         const price=next[c];
         if(product && !/^(precio|modelo|marca|disponibilidad|color|pedido|stock)$/i.test(product) && (price!==''&&price!==null&&price!==undefined)){
           const usd=priceFromCell(price);
           if(usd && !/sin stock|consulta|precio/i.test(String(price))) { add(makeImported(product,currentGeneral,'', '', 'Media',usd)); paired=true; }
         }
       }
       if(paired) r++;
     }
     continue;
   }

   if(sn==='FUNDA SILICONA'){
     const rate=priceFromCell(rows[0]?.[0]);
     for(let r=1;r<rows.length;r++){ const row=rows[r]||[]; if(row[1]) add(makeImported([row[0],row[1],row[2]].filter(Boolean).join(' '),'Fundas','Silicona',String(row[0]||''),'Media',rate)); }
     continue;
   }
   if(sn==='Funda especial'){
     for(let r=1;r<rows.length;r++){const row=rows[r]||[]; if(row[1]) add(makeImported([row[1],row[2],row[3]].filter(Boolean).join(' '),'Fundas','Especial','', 'Media',row[4]));}
     continue;
   }
   if(sn==='FUNDA MAGSAFE'){
     for(let r=1;r<rows.length;r++){const row=rows[r]||[]; if(row[2]) add(makeImported([row[1],row[2],row[3]].filter(Boolean).join(' '),'Fundas','MagSafe','', 'Media',row[5],row[4]));}
     continue;
   }
   if(sn==='ANTIESPIA'){
     for(let r=2;r<rows.length;r++){const row=rows[r]||[]; if(row[1]) add(makeImported([row[0],row[1]].filter(Boolean).join(' '),'Vidrios','Antiespia',String(row[0]||''),'Media',row[3],row[2]));}
     continue;
   }
   if(sn==='CURVO Y UV'){
     for(let r=3;r<rows.length;r++){const row=rows[r]||[]; if(row[2]) add(makeImported([row[0],row[1],row[2]].filter(Boolean).join(' '),'Vidrios','Curvo / UV',String(row[1]||''),'Media',row[3],row[4]));}
     continue;
   }
   if(sn==='TABLET TEMPLADO'){
     const rate=priceFromCell(rows[0]?.[0]);
     for(let r=3;r<rows.length;r++){const row=rows[r]||[]; if(row[2]) add(makeImported([row[0],row[1],row[2],row[3]].filter(Boolean).join(' '),'Vidrios','Tablet',String(row[1]||''),'Media',rate,row[5]));}
     continue;
   }
   if(sn==='FUNDA PARA IPAD'){
     for(let r=2;r<rows.length;r++){const row=rows[r]||[]; if(row[1]) add(makeImported([row[0],row[1]].filter(Boolean).join(' '),'Fundas','iPad',String(row[0]||''),'Media',row[row.length-1]));}
     continue;
   }
   if(sn==='APPLE WATCH'){
     let model='';
     for(let r=1;r<rows.length;r++){const row=rows[r]||[]; if(row[0]) model=String(row[0]); if(row[1]) add(makeImported([model,row[1]].filter(Boolean).join(' '),'Accesorios','Apple Watch','Apple','Media',row[2]));}
     continue;
   }
   if(sn==='9D' || sn==='2D'){
     const rate=priceFromCell(rows[0]?.[2]);
     for(let r=3;r<rows.length;r++){const row=rows[r]||[]; if(row[1]) add(makeImported([row[0],row[1]].filter(Boolean).join(' '),'Vidrios',sn,String(row[0]||''),'Media',rate,row[2]));}
     continue;
   }
   if(sn==='TEMPLADO HIGH ALUMINIUM'){
     let rate=priceFromCell(rows[1]?.[1]) || priceFromCell(rows[1]?.[6]);
     for(let r=3;r<rows.length;r++){const row=rows[r]||[]; 
       if(row[1]) add(makeImported(row[1],'Vidrios','High Aluminium',String(row[0]||''),'Media',rate,row[2]));
       if(row[5]) add(makeImported(row[5],'Vidrios','High Aluminium','Samsung','Media',rate,row[2]));
       if(row[6]) add(makeImported(row[6],'Vidrios','High Aluminium','Motorola','Media',rate,row[2]));
     }
     continue;
   }

   // Fallback for other Excel sheets: use rows as records and extract any explicit USD/price value.
   const objs=XLSX.utils.sheet_to_json(ws,{defval:''});
   if(objs.length){
     const mapped=mapCatalogRows(objs);
     mapped.forEach(x=>{ if(x.product) add(x); });
   }
 }
 // Remove exact duplicates produced by merged/duplicated catalog sections.
 const seen=new Set(), clean=[];
 for(const p of out){
   const key=[p.product,p.priceUSD,p.general,p.classification,p.brand].join('|').toLowerCase();
   if(!seen.has(key)){seen.add(key);clean.push(p);}
 }
 return clean;
}

async function bufferToDataURL(buf, ext){
  if(!buf) return '';
  const bytes = buf instanceof ArrayBuffer ? new Uint8Array(buf) : new Uint8Array(buf.buffer || buf);
  let binary=''; const chunk=0x8000;
  for(let i=0;i<bytes.length;i+=chunk) binary += String.fromCharCode(...bytes.subarray(i, Math.min(i+chunk, bytes.length)));
  const mime = ext==='png'?'image/png':ext==='gif'?'image/gif':ext==='webp'?'image/webp':'image/jpeg';
  return `data:${mime};base64,${btoa(binary)}`;
}
function normPhotoText(v){return String(v??'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,' ').trim();}
async function buildExcelPhotoRows(buf){
  const wb=new ExcelJS.Workbook(); await wb.xlsx.load(buf);
  const result={};
  for(const ws of wb.worksheets){
    const photos=[];
    for(const pic of ws.getImages()){
      try{
        const img=wb.getImage(pic.imageId); const d=pic.range?.tl || pic.range?.br;
        if(!d) continue;
        const row=Math.max(0, Math.round(d.nativeRow??d.row??0));
        const col=Math.max(0, Math.round(d.nativeCol??d.col??0));
        const url=await bufferToDataURL(img.buffer, img.extension);
        if(url) photos.push({row,col,url});
      }catch(err){ console.warn('No se pudo extraer una imagen',err); }
    }
    result[ws.name]=photos;
  }
  return result;
}
function attachExcelPhotos(products, wb, photoRows){
  if(!products.length) return products;
  for(const sn of Object.keys(photoRows||{})){
    const ws=wb.Sheets[sn]; if(!ws) continue;
    const rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:''});
    const candidates=(photoRows[sn]||[]).map(ph=>{
      const r=ph.row; const row=rows[r]||[];
      const text=normPhotoText(row.join(' '));
      return {...ph,text,row:r};
    });
    if(!candidates.length) continue;
    for(const p of products.filter(x=>!x.photo)){
      const pt=normPhotoText(p.product); if(!pt) continue;
      const tokens=pt.split(' ').filter(t=>t.length>=2);
      let best=null, bestScore=0;
      for(const c of candidates){
        if(!c.text) continue;
        let score=0; for(const t of tokens) if(c.text.includes(t)) score++;
        if(c.text.includes(pt)) score+=4;
        if(score>bestScore){bestScore=score;best=c;}
      }
      if(best && bestScore>=Math.max(1,Math.min(3,tokens.length))) p.photo=best.url;
    }
  }
  return products;
}
async function parseSunshineXlsxWithImages(buf, wb){
  const products=parseSunshineXlsx(wb);
  try{
    const photoRows=await buildExcelPhotoRows(buf);
    attachExcelPhotos(products, wb, photoRows);
  }catch(err){ console.warn('No se pudieron leer las fotos del Excel',err); }
  return products;
}
function parseCSVProducts(text){const lines=text.split(/\r?\n/).filter(x=>x.trim()); if(!lines.length)return[]; const sep=lines[0].includes(';')?';':','; const headers=lines[0].split(sep).map(x=>x.replace(/^"|"$/g,'')); return mapCatalogRows(lines.slice(1).map(line=>{const vals=line.split(sep).map(x=>x.replace(/^"|"$/g,'')); const o={}; headers.forEach((h,i)=>o[h]=vals[i]||''); return o;}));}
async function parsePDFCatalog(file){
 const buf=await file.arrayBuffer(); const pdf=await pdfjsLib.getDocument({data:buf}).promise; let text=''; for(let i=1;i<=pdf.numPages;i++){const page=await pdf.getPage(i); const c=await page.getTextContent(); text+='\n'+c.items.map(x=>x.str).join(' ');}
 const provider=detectProviderFromText(text); const lines=text.split(/\n+/).map(x=>x.trim()).filter(Boolean); const out=[]; lines.forEach(line=>{const price=line.match(/(?:\$\s*)?([0-9]{2,}(?:[.,][0-9]{2,3})?)/); if(price){const product=line.replace(price[0],'').replace(/\s{2,}/g,' ').trim(); if(product.length>2)out.push({product,price:price[1].replace('.','').replace(',','.'),general:'Varios',classification:'',brand:'',quality:'Media',dispatch:'',currentAccount:'No',discount:'No',percent:'0',obs:''});}}); return {products:out.slice(0,1000),provider};
}
function normalizeImportedPrices(){importedCatalog.forEach(p=>{if(!p.priceUSD && p.price){p.priceUSD='';}p.priceARS=arsFromUsd(p.priceUSD,p.dollarRate);});}

 normalizeImportedPrices();

 status.textContent=`Se detectaron ${importedCatalog.length} productos. Revisalos y editá lo que haga falta antes de guardar.`; btn.style.display=importedCatalog.length?'inline-block':'none';
 box.innerHTML=importedCatalog.length?`<div style="overflow:auto;max-height:50vh"><table style="min-width:1150px"><thead><tr><th>Producto</th><th>Foto</th><th>General</th><th>Clasificación</th><th>Marca</th><th>Calidad</th><th>USD</th><th>Tasa</th><th>Pesos</th><th>Despacho</th><th>Acciones</th></tr></thead><tbody>${importedCatalog.map((p,i)=>`<tr><td><input value="${esc(p.product)}" onchange="importedCatalog[${i}].product=this.value"></td><td><input type="file" accept="image/*" onchange="setImportedPhoto(${i},this)">${p.photo?`<br><button class="secondary" onclick="viewImportedPhoto(${i})">👁️ Ver foto</button>`:'<small>Sin foto</small>'}</td><td><select onchange="importedCatalog[${i}].general=this.value"><option ${p.general==='Vidrios'?'selected':''}>Vidrios</option><option ${p.general==='Fundas'?'selected':''}>Fundas</option><option ${p.general==='Accesorios'?'selected':''}>Accesorios</option><option ${p.general==='Varios'?'selected':''}>Varios</option></select></td><td><input value="${esc(p.classification)}" onchange="importedCatalog[${i}].classification=this.value"></td><td><input value="${esc(p.brand)}" onchange="importedCatalog[${i}].brand=this.value"></td><td><select onchange="importedCatalog[${i}].quality=this.value"><option ${p.quality==='Alta'?'selected':''}>Alta</option><option ${p.quality==='Media'?'selected':''}>Media</option><option ${p.quality==='Baja'?'selected':''}>Baja</option></select></td><td><input value="${esc(p.priceUSD||p.price||'')}" onchange="editImportedPrice(${i},this.value)"></td><td><input value="${esc(p.dollarRate||'')}" onchange="editImportedRate(${i},this.value)"></td><td><input readonly value="${p.priceARS?money(p.priceARS):''}"></td><td><input value="${esc(p.dispatch||'')}" onchange="importedCatalog[${i}].dispatch=this.value"></td><td style="white-space:nowrap"><button class="secondary" onclick="editImportedProduct(${i})">✏️ Editar</button> <button class="secondary" onclick="removeImportedProduct(${i})">🗑️</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">No se detectaron productos. Probá con Excel/CSV, PDF, Word o una imagen más nítida.</div>';
}
function editImportedPrice(i,value){ importedCatalog[i].priceUSD=value; importedCatalog[i].priceARS=arsFromUsd(value,importedCatalog[i].dollarRate); renderCatalogPreview(); }

 const u=()=>{document.getElementById('ep_ars').value=money(arsFromUsd(document.getElementById('ep_usd').value,document.getElementById('ep_rate').value))};

function viewImportedPhoto(i){const p=importedCatalog[i];if(!p.photo){alert('Este producto todavía no tiene foto.');return}const w=window.open('','_blank');if(w)w.document.write('<title>Foto del producto</title><style>body{margin:0;background:#111;display:flex;align-items:center;justify-content:center;height:100vh}img{max-width:95%;max-height:95%;object-fit:contain}</style><img src="'+p.photo+'">')}

 if(!provider){alert('Elegí un proveedor antes de guardar el catálogo.');return}
